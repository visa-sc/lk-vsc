<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Калькулятор страхования — VOYO</title>
<link rel="icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/calc-logo.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/calc-logo.png" />
<style>
  :root {
    --bg: #f5f5f7; --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #8a8a8e;
    --blue: #0071e3; --blue-d: #0058b8;
    --green: #34c759; --green-d: #1f8f4d; --green-line: #c4ead0;
    --line: rgba(0,0,0,.08);
    --sh-sm: 0 1px 2px rgba(0,0,0,.04);
    --sh: 0 6px 20px rgba(0,0,0,.06);
    --sh-lg: 0 18px 48px rgba(20,24,40,.10);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; color: var(--ink); line-height: 1.47;
    background: radial-gradient(1100px 480px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 62%), var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 18px 80px; }
  @media (min-width: 760px) { .wrap { padding-top: 88px; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--sh-lg); }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.022em; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--ink3); margin: 0 0 22px; letter-spacing: -.01em; }
  /* «i» с пояснением у заголовка (как на /vsc и /calc). */
  .info { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%; border: 1.4px solid currentColor; color: #a9adb4; font-size: 12.5px; font-weight: 700; font-style: italic; font-family: Georgia, "Times New Roman", serif; line-height: 1; cursor: pointer; vertical-align: middle; margin-left: 11px; position: relative; top: -3px; -webkit-user-select: none; user-select: none; transition: color .15s ease, border-color .15s ease; }
  .info:hover { color: var(--blue); }
  .info-pop { display: none; position: fixed; z-index: 9999; box-sizing: border-box; width: min(360px, 82vw); background: #1c2333; color: #e7ecf5; font: 400 13px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 14px 16px; border-radius: 14px; box-shadow: 0 14px 38px rgba(16,24,40,.38); text-align: left; white-space: normal; cursor: default; }
  .info-pop.show { display: block; }
  .info-pop b { color: #fff; font-weight: 700; }
  .info-pop::before { content: ""; position: absolute; bottom: 100%; left: var(--arrow-left, 50%); transform: translateX(-50%); border: 6px solid transparent; border-bottom-color: #1c2333; }
  .info-pop.up::before { bottom: auto; top: 100%; border-bottom-color: transparent; border-top-color: #1c2333; }

  .field { margin-bottom: 18px; }
  .field > .flbl { font-size: 12px; color: var(--ink3); font-weight: 600; letter-spacing: -.01em; margin: 0 0 8px 2px; }
  /* Сегментированный переключатель (как валютные кнопки на /calc). */
  .seg { display: flex; gap: 4px; background: #ececef; border-radius: 14px; padding: 4px; flex-wrap: wrap; }
  .seg button { flex: 1 1 0; min-width: 84px; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; border: none; background: transparent; color: var(--ink2); font-family: inherit; letter-spacing: -.01em; transition: background .18s ease, color .18s ease, box-shadow .18s ease; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); font-weight: 680; }
  /* Чекбоксы доп. рисков. */
  .risks { display: grid; gap: 8px; }
  .risk { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #e6e6ea; border-radius: 14px; background: #fafafc; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .risk:hover { border-color: #d0d0d6; }
  .risk.on { border-color: var(--blue); background: #f2f8ff; }
  .risk input { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border: 1.6px solid #c2c2c8; border-radius: 6px; background: #fff; flex: none; cursor: pointer; position: relative; transition: border-color .15s ease, background .15s ease; }
  .risk.on input { border-color: var(--blue); background: var(--blue); }
  .risk.on input::after { content: "✓"; position: absolute; inset: 0; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .risk .rmid { display: flex; flex-direction: column; min-width: 0; }
  .risk .rname { display: block; font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  .risk .rsub { display: block; font-size: 11.5px; color: var(--ink3); font-weight: 500; margin-top: 1px; }
  .risk .rprice { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .risk .rprice.tbd { color: #c47f2e; font-weight: 600; font-size: 12px; }

  .receipt { margin-top: 22px; border-top: 1px dashed #e2e2e7; padding-top: 16px; }
  .rline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 14px; }
  .rline .rl-t { color: var(--ink2); }
  .rline .rl-v { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rline.tbd .rl-v { color: #c47f2e; font-weight: 600; font-size: 12.5px; }
  .total { position: relative; margin-top: 16px; background: linear-gradient(180deg, #f1fbf5, #e8f8ee); border: 1px solid var(--green-line); border-radius: 18px; padding: 18px 20px; cursor: pointer; box-shadow: var(--sh-sm); transition: transform .15s ease, box-shadow .15s ease; }
  .total:hover { transform: translateY(-2px); box-shadow: var(--sh); }
  .total:active { transform: translateY(0); }
  .total .tt { font-size: 12px; color: var(--green-d); font-weight: 600; letter-spacing: -.01em; }
  .total .tv { font-size: 30px; font-weight: 700; color: #1f8f4d; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .total::after { content: "⧉"; position: absolute; top: 15px; right: 17px; font-size: 13px; color: var(--green); opacity: .5; transition: opacity .15s ease; }
  .total:hover::after { opacity: 1; }
  .note { margin-top: 12px; font-size: 12px; color: #c47f2e; background: #fff7ec; border: 1px solid #f2e0c2; border-radius: 12px; padding: 10px 13px; line-height: 1.5; }
  .note.hide { display: none; }
  .ft { text-align: center; color: var(--ink3); font-size: 12px; margin-top: 26px; letter-spacing: -.01em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Калькулятор страхования<span class="info" id="insInfo" tabindex="0" role="button" aria-label="Пояснение">i</span></h1>
    <p class="sub">АБСОЛЮТ · сумма покрытия 30 000 € (Программа А)</p>

    <div class="field">
      <div class="flbl">Возраст застрахованного</div>
      <div class="seg" id="segAge"></div>
    </div>

    <div class="field">
      <div class="flbl">Продолжительность поездки</div>
      <div class="seg" id="segDur"></div>
    </div>

    <div class="field">
      <div class="flbl">Программа (базовый полис)</div>
      <div class="seg" id="segAct"></div>
    </div>

    <div class="field" style="margin-bottom:4px;">
      <div class="flbl">Дополнительные риски (прибавляются к цене полиса)</div>
      <div class="risks" id="risks"></div>
    </div>

    <div class="receipt" id="receipt"></div>
    <div class="total" id="total" title="Нажмите, чтобы скопировать сумму">
      <div class="tt">Итоговая стоимость полиса</div>
      <div class="tv" id="totalVal">—</div>
    </div>
    <div class="note hide" id="tbdNote"></div>
  </div>
  <div class="ft">VOYO · Visa Services Center</div>
</div>

<script>
  function $(id){ return document.getElementById(id); }
  function ru0(v){ return (v == null || isNaN(v)) ? "—" : Math.round(v).toLocaleString("ru-RU"); }

  // ── ТАРИФЫ АБСОЛЮТ · Программа А (покрытие 30 000 €). Цены полиса — в рублях. ──
  // Возрастные группы (столбцы в таблице тарифов) и продолжительность (строки).
  var AGES = [
    { key: "kid",    label: "До 4 лет",   full: "Младше 4 лет" },
    { key: "adult",  label: "4–64 года",  full: "От 4 до 64 лет включительно" },
    { key: "senior", label: "65–80 лет",  full: "От 65 до 80 лет" }
  ];
  var DURS = [
    { key: "d15", label: "1–15 дней" },
    { key: "d30", label: "16–30 дней" },
    { key: "d45", label: "31–45 дней" },
    { key: "d60", label: "46–60 дней" }
  ];
  var ACTS = [
    { key: "standard", label: "Без приключений", full: "Без приключений (стандартная страховка)" },
    { key: "active",   label: "Активный отдых",  full: "Активный отдых" },
    { key: "sport",    label: "Спорт",           full: "Спорт" }
  ];
  // Базовый полис: BASE[act][dur][age]. Данные из листа «Стандартная» (Программа А, 30 000 €).
  var BASE = {
    standard: {
      d15: { adult: 850,  kid: 1700,  senior: 1700 },
      d30: { adult: 1500, kid: 3000,  senior: 3000 },
      d45: { adult: 2000, kid: 4000,  senior: 4000 },
      d60: { adult: 2700, kid: 5400,  senior: 5400 }
    },
    active: {
      d15: { adult: 1105, kid: 2210,  senior: 2210 },
      d30: { adult: 1950, kid: 3900,  senior: 3900 },
      d45: { adult: 2600, kid: 5200,  senior: 5200 },
      d60: { adult: 3510, kid: 7020,  senior: 7020 }
    },
    sport: {
      d15: { adult: 1700, kid: 3400,  senior: 3400 },
      d30: { adult: 3000, kid: 6000,  senior: 6000 },
      d45: { adult: 4000, kid: 8000,  senior: 8000 },
      d60: { adult: 5400, kid: 10800, senior: 10800 }
    }
  };
  // Доп. риски. НС и ГО — зависят от продолжительности (не от возраста). Отмена — фикс (ни от чего).
  // ⚠ Значения пока не заведены (нет в тарифах) — как только пришлют, вписать сюда числа.
  var RISKS = [
    { key: "ns",     name: "Несчастный случай (НС)",        sub: "зависит от продолжительности", by: "dur",
      tariff: { d15: null, d30: null, d45: null, d60: null } },
    { key: "go",     name: "Гражданская ответственность (ГО)", sub: "зависит от продолжительности", by: "dur",
      tariff: { d15: null, d30: null, d45: null, d60: null } },
    { key: "cancel", name: "Отмена поездки",                sub: "фиксированная стоимость", by: "flat",
      tariff: null }
  ];

  var st = { age: "adult", dur: "d15", act: "standard", ns: false, go: false, cancel: false };

  function riskPrice(r){ return r.by === "flat" ? r.tariff : (r.tariff ? r.tariff[st.dur] : null); }

  // ── Отрисовка сегментов и чекбоксов ──
  function buildSeg(host, items, stKey){
    host.innerHTML = "";
    items.forEach(function(it){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = it.label; if (it.full) b.title = it.full;
      b.setAttribute("data-k", it.key);
      b.className = (st[stKey] === it.key ? "on" : "");
      b.addEventListener("click", function(){ st[stKey] = it.key; buildSeg(host, items, stKey); compute(); });
      host.appendChild(b);
    });
  }
  function buildRisks(){
    var host = $("risks"); host.innerHTML = "";
    RISKS.forEach(function(r){
      var on = st[r.key];
      var p = riskPrice(r);
      var row = document.createElement("label");
      row.className = "risk" + (on ? " on" : "");
      var priceHtml = (p == null)
        ? '<span class="rprice tbd">тариф уточняется</span>'
        : '<span class="rprice">+' + ru0(p) + ' ₽</span>';
      row.innerHTML =
        '<input type="checkbox"' + (on ? " checked" : "") + ' />' +
        '<span class="rmid"><span class="rname">' + r.name + '</span><span class="rsub">' + r.sub + '</span></span>' +
        priceHtml;
      row.querySelector("input").addEventListener("change", function(e){ st[r.key] = e.target.checked; buildRisks(); compute(); });
      host.appendChild(row);
    });
  }

  function compute(){
    var base = BASE[st.act][st.dur][st.age];
    var actLabel = ACTS.filter(function(a){ return a.key === st.act; })[0].full;
    var rows = [{ t: "Базовый полис · " + actLabel, v: base, tbd: false }];
    var total = base, anyTbd = false, tbdNames = [];
    RISKS.forEach(function(r){
      if (!st[r.key]) return;
      var p = riskPrice(r);
      if (p == null) { anyTbd = true; tbdNames.push(r.name); rows.push({ t: r.name, v: null, tbd: true }); }
      else { total += p; rows.push({ t: r.name, v: p, tbd: false }); }
    });
    var rc = $("receipt"); rc.innerHTML = "";
    rows.forEach(function(x){
      var d = document.createElement("div");
      d.className = "rline" + (x.tbd ? " tbd" : "");
      d.innerHTML = '<span class="rl-t">' + x.t + '</span><span class="rl-v">' + (x.tbd ? "тариф уточняется" : (ru0(x.v) + " ₽")) + '</span>';
      rc.appendChild(d);
    });
    $("totalVal").textContent = ru0(total) + " ₽" + (anyTbd ? " *" : "");
    var note = $("tbdNote");
    if (anyTbd) {
      note.classList.remove("hide");
      note.textContent = "* Без учёта: " + tbdNames.join(", ") + ". Тарифы этих рисков пока не заведены — итог будет пересчитан, как только их пришлют.";
    } else { note.classList.add("hide"); note.textContent = ""; }
  }

  // Копирование итоговой суммы по клику.
  $("total").addEventListener("click", function(){
    var num = ($("totalVal").textContent || "").replace(/[^\d]/g, "");
    if (!num) return;
    var tt = $("total").querySelector(".tt"), orig = tt.textContent;
    function flash(){ tt.textContent = "✓ Скопировано"; $("total").style.background = "#dff3e6"; setTimeout(function(){ tt.textContent = orig; $("total").style.background = ""; }, 1000); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(num).then(flash).catch(function(){});
    else { var ta = document.createElement("textarea"); ta.value = num; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} document.body.removeChild(ta); flash(); }
  });

  // «i» у заголовка: пояснение (портал в body, как на /vsc и /calc).
  (function(){
    var w = $("insInfo"); if (!w) return;
    var pop = document.createElement("span");
    pop.className = "info-pop";
    pop.innerHTML =
      '<b>Как пользоваться</b><br>Выбери возраст застрахованного, продолжительность поездки и программу (базовый полис). Отметь дополнительные риски — они прибавляются к цене полиса. Итог можно скопировать кликом.'
      + '<br><br><b>Логика тарифов АБСОЛЮТ</b><br>'
      + '• Цена базового полиса зависит от возраста и продолжительности.<br>'
      + '• «Активный отдых» и «Спорт» — это целая (другая) стоимость полиса вместо стандартной.<br>'
      + '• НС и ГО зависят только от продолжительности, «Отмена поездки» — фиксированная. От возраста эти три риска не зависят.';
    function place(){
      if (pop.parentNode !== document.body) document.body.appendChild(pop);
      pop.classList.add("show");
      var r = w.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, pw = Math.min(360, vw - 24);
      pop.style.width = pw + "px";
      var left = Math.max(12, Math.min(r.left + r.width/2 - pw/2, vw - pw - 12));
      pop.style.left = left + "px";
      pop.style.top = (r.bottom + 9) + "px";
      pop.classList.remove("up");
      var ph = pop.offsetHeight;
      if (r.bottom + 9 + ph > vh - 12 && r.top - 9 - ph > 12) { pop.style.top = (r.top - 9 - ph) + "px"; pop.classList.add("up"); }
      pop.style.setProperty("--arrow-left", Math.max(10, Math.min(pw - 10, r.left + r.width/2 - left)) + "px");
    }
    function close(){ w.classList.remove("open"); pop.classList.remove("show", "up"); if (pop.parentNode) pop.parentNode.removeChild(pop); }
    w.addEventListener("click", function(e){ e.stopPropagation(); var was = w.classList.contains("open"); close(); if (!was){ w.classList.add("open"); place(); } });
    w.addEventListener("mouseenter", function(){ if (!w.classList.contains("open")) place(); });
    w.addEventListener("mouseleave", function(){ if (!w.classList.contains("open")) close(); });
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    document.addEventListener("click", close);
    window.addEventListener("scroll", function(){ if (pop.classList.contains("show")) close(); }, true);
    window.addEventListener("resize", function(){ if (pop.classList.contains("show")) close(); });
  })();

  buildSeg($("segAge"), AGES, "age");
  buildSeg($("segDur"), DURS, "dur");
  buildSeg($("segAct"), ACTS, "act");
  buildRisks();
  compute();
</script>
</body>
</html>
