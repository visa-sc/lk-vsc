<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VSC fin">
<meta name="theme-color" content="#f2f4f7">
<title>VSC fin — рабочие финансы</title>
<link rel="apple-touch-icon" href="/fin-logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="/fin-logo.png">
<link rel="icon" href="/fin-logo.png">
<style>
  :root{
    --brand:#2695d9;
    --ink:#1d1d1f;
    --muted:#8a8f98;
    --line:rgba(0,0,0,.08);
    --card:#fff;
    --bg:#f2f4f7;
    --red:#ff3b30;
    --ctl:40px;            /* общая высота блоков строки: чипсы, метки, дата, комментарий */
    --shadow:0 1px 4px rgba(0,40,70,.06);
    --shadow-hi:0 4px 16px rgba(0,40,70,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:16px;
  }
  button{font:inherit;cursor:pointer;}
  .wrap{max-width:620px;margin:0 auto;padding:0 16px 40px;}
  /* Воздух сверху задаём СПЕЙСЕРОМ, а не flex-центрированием: при открытии
     клавиатуры iOS меняет высоту вьюпорта, и центрированный блок уезжал вверх
     и не возвращался. Ровно тот же приём, что в личных финансах. */
  #main .spacer{height:18vh;min-height:calc(env(safe-area-inset-top) + 72px);transition:height .28s ease,min-height .28s ease;}
  #main.hist .spacer{height:0;min-height:calc(env(safe-area-inset-top) + 6px);}

  /* ── Вход ── */
  #login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;}
  #login img{width:88px;height:88px;border-radius:22px;box-shadow:0 10px 30px rgba(38,149,217,.32);}
  #code{width:100%;max-width:300px;font:inherit;font-size:20px;text-align:center;letter-spacing:4px;padding:15px;border:none;border-radius:16px;background:#fff;box-shadow:var(--shadow-hi);}
  .btn{border:none;border-radius:16px;padding:15px 18px;background:var(--brand);color:#fff;font-size:16px;font-weight:500;transition:transform .1s,opacity .2s;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;}
  #login .btn,#bioBtn{width:100%;max-width:300px;}
  #bioBtn{background:#fff;color:var(--brand);box-shadow:var(--shadow-hi);}
  #loginErr{color:var(--red);font-size:14px;min-height:18px;}

  /* ── Шапка: только лого и курсы ── */
  header{display:flex;align-items:center;margin-bottom:14px;}
  header img{width:40px;height:40px;border-radius:11px;}
  .rates{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);line-height:1.35;}
  .rates b{color:var(--ink);font-weight:600;}

  /* ── Вкладки ── */
  .tabs{display:flex;background:rgba(0,0,0,.05);border-radius:14px;padding:3px;margin-bottom:16px;}
  .tabs button{flex:1;font-size:15px;font-weight:500;border:none;background:transparent;color:var(--muted);padding:10px;border-radius:11px;transition:.18s;}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);}

  /* ── Операторы над суммой (− + × ÷ и валюты) ── */
  .ops{display:flex;gap:7px;margin-bottom:10px;justify-content:flex-end;flex-wrap:wrap;}
  .opbtn{width:44px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;font-weight:600;box-shadow:var(--shadow);}
  .opbtn:active{background:var(--bg);}
  .opbtn.cur{color:var(--brand);font-size:17px;}

  /* ── Сумма ── */
  .amount-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 20px;box-shadow:var(--shadow-hi);margin-bottom:12px;}
  #amount{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:30px;font-weight:600;color:var(--ink);padding:0;}
  #amount::placeholder{color:#c9ced6;}
  .rub{white-space:nowrap;color:var(--muted);font-size:22px;}
  .rub.calc{font-size:15px;font-weight:600;}

  /* ── Поля ── */
  .fld{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 18px;box-shadow:var(--shadow);margin-bottom:10px;}
  .fld input{width:100%;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink);padding:0;}
  .fld input::placeholder{color:#b9bfc7;}
  .lbl{font-size:12px;color:var(--muted);margin:0 0 5px 4px;}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chips button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);
                border-radius:var(--ctl);height:var(--ctl);padding:0 14px;font-size:14.5px;box-shadow:var(--shadow);}
  .chips button.on{background:#eaf5fd;border-color:var(--brand);color:var(--brand);}
  .chips button small{color:var(--muted);margin-left:6px;font-size:13px;}

  /* метки строки: красят «Наименование» в таблице (жёлтая — разобраться, красная — вернуть) */
  .flag{flex:0 0 auto;width:var(--ctl);height:var(--ctl);border-radius:var(--ctl);border:2px solid transparent;background:var(--card);
        box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;}
  .flag i{display:block;width:21px;height:21px;border-radius:11px;}
  .flag.yellow i{background:#ffd60a;}
  .flag.red i{background:#ff453a;}
  .flag.on{border-color:var(--brand);}
  /* Составная строка: все блоки одной высоты (--ctl), порядок задаётся вкладкой. */
  .row2{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .row2 .chips{flex:0 1 auto;min-width:0;margin-bottom:0;gap:8px;}
  .row2 .fld{flex:0 1 auto;min-width:0;margin-bottom:0;height:var(--ctl);padding:0 14px;
             border-radius:var(--ctl);display:flex;align-items:center;}
  .row2 .datefld{flex:1 1 auto;min-width:104px;padding:0 6px;}
  .datefld input{text-align:center;font-size:14.5px;}
  /* убираем родную иконку календаря: на айфоне её нет, а в Chrome она съедала
     ~20px и выдавливала дату на отдельную строку (пикер открываем по тапу) */
  .datefld input::-webkit-calendar-picker-indicator{display:none;}
  .row2 .chips button{padding:0 12px;font-size:13.5px;}
  /* РАСХОДЫ: категории · метки · дата — одной строкой; комментарий — отдельной */
  #main.t-exp .row2 #cats{order:1;flex:0 1 auto;}
  #main.t-exp .row2 .flag.yellow{order:2;}
  #main.t-exp .row2 .flag.red{order:3;}
  #main.t-exp .row2 .datefld{order:4;}
  #main.t-exp .row2 .commentfld{order:5;flex:1 1 100%;}
  /* ПРИХОДЫ: метки · комментарий · дата — всё одной строкой */
  #main.t-inc .row2 .flag.yellow{order:1;}
  #main.t-inc .row2 .flag.red{order:2;}
  #main.t-inc .row2 .commentfld{order:3;flex:1 1 110px;min-width:110px;}
  #main.t-inc .row2 .datefld{order:4;}
  #addBtn{width:100%;font-size:17px;padding:16px;border-radius:18px;}

  /* ── Нижняя строка: выгрузка и записи ── */
  .recline{display:flex;align-items:center;margin:14px 0 6px;gap:10px;}
  .recline button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:9px 14px;font-size:13.5px;box-shadow:var(--shadow);}
  #recToggle{margin-left:auto;border:none;background:transparent;color:var(--muted);box-shadow:none;}

  /* ── Записи ── */
  .day{margin-bottom:14px;}
  .day h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 7px 4px;display:flex;}
  .day h3 span{margin-left:auto;}
  /* свайп влево по записи → «Изменить» и «Удалить» под строкой (как в /fin) */
  .swipe{position:relative;margin-bottom:7px;}
  .swipe .edit,.swipe .del{position:absolute;top:0;bottom:0;width:88px;border:0;border-radius:15px;color:#fff;
        font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s;}
  .swipe .del{right:0;background:var(--red);}
  .swipe .edit{right:94px;background:var(--brand);}
  .swipe.open .edit,.swipe.open .del{opacity:1;pointer-events:auto;}
  .swipe .rec{margin-bottom:0;transition:transform .18s;touch-action:pan-y;}
  .swipe.open .rec{transform:translateX(-188px);}
  .swipe .rec.drag{transition:none;}
  .rec{background:#fff;border-radius:15px;padding:12px 15px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
  .rec .nm{flex:1;min-width:0;}
  .rec .nm b{display:block;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rec .nm i{font-style:normal;font-size:12px;color:var(--muted);}
  .rec .am{font-size:16px;font-weight:600;white-space:nowrap;}
  .rec .x{font-size:20px;color:#ccd1d8;padding:0 2px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 0;}

  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;
         font-size:14px;padding:11px 18px;border-radius:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center;}
  #toast.on{opacity:1;}
  .hide{display:none!important;}
</style>
</head>
<body>

<!-- ── Вход ── -->
<div id="login">
  <img src="/fin-logo.png" alt="VSC fin">
  <input id="code" type="tel" inputmode="numeric" placeholder="код" autocomplete="off">
  <button class="btn" onclick="doLogin()">Войти</button>
  <button id="bioBtn" class="btn hide" onclick="bioLogin()">Войти по Face ID</button>
  <div id="loginErr"></div>
</div>

<!-- ── Основной экран ── -->
<div id="main" class="wrap hide t-exp">
  <div class="spacer"></div>

  <header>
    <img src="/fin-logo.png" alt="VSC fin">
    <div class="rates" id="rates" onclick="refreshRates(1)">курсы…</div>
  </header>

  <div class="tabs">
    <button id="tabExp" class="on" onclick="setTab('exp')">Расходы</button>
    <button id="tabInc" onclick="setTab('inc')">Приходы</button>
  </div>

  <!-- Операторы: $ и € подставляют умножение на актуальный курс ЦБ -->
  <div class="ops">
    <button class="opbtn" onclick="op('−')">−</button>
    <button class="opbtn" onclick="op('+')">+</button>
    <button class="opbtn" onclick="op('×')">×</button>
    <button class="opbtn" onclick="op('÷')">÷</button>
    <button class="opbtn cur" id="opUsd" onclick="opCur('USD')">$</button>
    <button class="opbtn cur" onclick="opCur('EUR')">€</button>
  </div>

  <div class="amount-row">
    <input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
    <span class="rub" id="rubSign">₽</span>
  </div>

  <div class="fld"><input id="name" type="text" placeholder="За что" autocomplete="off"></div>
  <div class="chips" id="sugg"></div>

  <div class="row2">
    <div class="chips" id="cats"></div>
    <button class="flag yellow" id="flagYellow" onclick="setFlag('yellow')" title="разобраться"><i></i></button>
    <button class="flag red" id="flagRed" onclick="setFlag('red')" title="вернуть"><i></i></button>
    <div class="fld datefld"><input id="date" type="date" onclick="if(this.showPicker)this.showPicker()"></div>
    <div class="fld commentfld"><input id="comment" type="text" placeholder="Комментарий" autocomplete="off"></div>
  </div>

  <button id="addBtn" class="btn" onclick="addEntry()">Внести</button>

  <div class="recline">
    <button id="dlBtn" onclick="downloadTable()">Скачать таблицу</button>
    <button id="bioEnroll" class="hide" onclick="bioRegister()">Face ID</button>
    <button id="recToggle" onclick="toggleRecords()">Записи ›</button>
  </div>

  <div id="records" style="display:none"></div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const LS_TOKEN = "vscfinToken";
let token = localStorage.getItem(LS_TOKEN) || "";
let tab = "exp";
let state = { ref: { categories: [], expense: [], income: [] }, rates: {}, today: "" };
let selCat = "";
let selFlag = "";
let editId = null;
let recordsOpen = false;

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 2600); }
function fmt(n) { return (Math.round(n * 100) / 100).toLocaleString("ru-RU", { maximumFractionDigits: 2 }); }

async function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ "Content-Type": "application/json", Authorization: "Bearer " + token }, opts.headers || {});
  const r = await fetch(url, opts);
  if (r.status === 401) { localStorage.removeItem(LS_TOKEN); token = ""; showLogin(); throw new Error("auth"); }
  return r.json();
}

/* ── Вход ── */
function showLogin() { $("login").classList.remove("hide"); $("main").classList.add("hide"); updateBioBtn(); }
function showMain() { $("login").classList.add("hide"); $("main").classList.remove("hide"); }
async function doLogin() {
  $("loginErr").textContent = "";
  try {
    const r = await (await fetch("/akfin/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("code").value.trim() }) })).json();
    if (!r.success) { $("loginErr").textContent = r.message || "Ошибка"; return; }
    token = r.token; localStorage.setItem(LS_TOKEN, token);
    showMain(); await refresh();
  } catch (e) { $("loginErr").textContent = "Ошибка сети"; }
}
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

/* ── Face ID ── */
const b2a = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const a2b = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
async function updateBioBtn() {
  try {
    if (!window.PublicKeyCredential) return;
    const r = await (await fetch("/akfin/api/bio/has", { method: "POST" })).json();
    $("bioBtn").classList.toggle("hide", !r.has);
  } catch (e) {}
}
async function bioLogin() {
  try {
    const opts = await (await fetch("/akfin/api/bio/auth-options", { method: "POST" })).json();
    if (!opts.challenge) return false;
    opts.challenge = b2a(opts.challenge);
    (opts.allowCredentials || []).forEach((c) => { c.id = b2a(c.id); });
    const cred = await navigator.credentials.get({ publicKey: opts });
    const payload = { id: cred.id, rawId: a2b(cred.rawId), type: cred.type,
      response: { clientDataJSON: a2b(cred.response.clientDataJSON), authenticatorData: a2b(cred.response.authenticatorData),
        signature: a2b(cred.response.signature), userHandle: cred.response.userHandle ? a2b(cred.response.userHandle) : null },
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {} };
    const r = await (await fetch("/akfin/api/bio/auth-verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ assertionResponse: payload }) })).json();
    if (!r.success) { $("loginErr").textContent = r.message || "Не получилось"; return false; }
    token = r.token; localStorage.setItem(LS_TOKEN, token);
    showMain(); await refresh();
    return true;
  } catch (e) { return false; }
}
async function bioRegister() {
  try {
    const opts = await api("/akfin/api/bio/register-options", { method: "POST" });
    if (!opts.challenge) { toast(opts.message || "Ошибка"); return; }
    opts.challenge = b2a(opts.challenge);
    opts.user.id = new TextEncoder().encode("vscfin-owner");
    (opts.excludeCredentials || []).forEach((c) => { c.id = b2a(c.id); });
    const cred = await navigator.credentials.create({ publicKey: opts });
    const payload = { id: cred.id, rawId: a2b(cred.rawId), type: cred.type,
      response: { clientDataJSON: a2b(cred.response.clientDataJSON), attestationObject: a2b(cred.response.attestationObject) },
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {} };
    const r = await api("/akfin/api/bio/register-verify", { method: "POST", body: JSON.stringify({ attestationResponse: payload }) });
    if (r.success) { $("bioEnroll").classList.add("hide"); toast("Face ID включён"); }
    else toast(r.message || "Не получилось");
  } catch (e) {
    if (String(e.message) === "auth") return;
    if (e && e.name === "InvalidStateError") { $("bioEnroll").classList.add("hide"); toast("Face ID уже был включён"); }
    else toast("Face ID отменён");
  }
}

/* ── Курсы ЦБ ── */
function renderRates() {
  const r = state.rates || {};
  if (!r.usd && !r.eur && !r.usdt) { $("rates").textContent = "курсы недоступны"; return; }
  const d = r.date ? String(r.date).slice(0, 5) : "";
  $("rates").innerHTML = "$ <b>" + fmt(r.usd || 0) + "</b> · € <b>" + fmt(r.eur || 0) + "</b>"
    + (r.usdt ? " · USDT <b>" + fmt(r.usdt) + "</b>" : "")
    + "<br>ЦБ" + (d ? " на " + d : "") + (r.usdt ? " · USDT из калькулятора" : "");
}
async function refreshRates(fresh) {
  try {
    const r = await api("/akfin/api/rates" + (fresh ? "?fresh=1" : ""));
    if (r.success) { state.rates = r.rates; renderRates(); if (fresh) toast("Курсы обновлены"); }
  } catch (e) {}
}

/* ── Сумма как выражение ── */
// Кнопки − + × ÷ подставляются в поле; $ и € дописывают «×курс ЦБ»,
// чтобы валюту не считать в уме: 330 → $ → «330×86,1909» = 28 443 ₽.
function normExpr(s) { return String(s || "").replace(/,/g, ".").replace(/\s+/g, "").replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-"); }
function calcExpr(s) {
  s = normExpr(s);
  if (!s || !/^[0-9.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return(' + s + ")")(); return isFinite(v) ? v : NaN; } catch (e) { return NaN; }
}
function isExpr(s) { return /[+\-*/×÷]/.test(normExpr(s).slice(1)); } // минус первым знаком — не выражение
function op(ch) { const a = $("amount"); a.value += ch; a.focus(); updateRub(); }
// Доллар в РАСХОДАХ считаем по курсу USDT из калькулятора (им же считают расход
// в /calc), в ПРИХОДАХ — по ЦБ. Евро всегда по ЦБ. Курс округлён до сотых.
function rateFor(c) {
  if (c === "EUR") return state.rates.eur;
  return tab === "exp" ? (state.rates.usdt || state.rates.usd) : state.rates.usd;
}
function opCur(c) {
  const rate = rateFor(c);
  if (!rate) { toast("Нет курса"); return; }
  const a = $("amount");
  if (!a.value.trim()) { toast("Сначала сумма в " + (c === "USD" ? "долларах" : "евро")); a.focus(); return; }
  a.value += "×" + String(Math.round(rate * 100) / 100).replace(".", ",");
  a.focus(); updateRub();
}
function updateRub() {
  const el = $("rubSign");
  const raw = $("amount").value;
  if (!isExpr(raw)) { el.textContent = "₽"; el.classList.remove("calc"); return; }
  const v = calcExpr(raw);
  el.textContent = v > 0 ? "= " + fmt(Math.round(v * 100) / 100) + " ₽" : "₽";
  el.classList.add("calc");
}
$("amount").addEventListener("input", updateRub);

/* ── Вкладки, категории, подсказки ── */
function setTab(t) {
  tab = t;
  $("tabExp").classList.toggle("on", t === "exp");
  $("tabInc").classList.toggle("on", t === "inc");
  $("cats").classList.toggle("hide", t !== "exp");
  $("name").placeholder = "За что";
  $("main").classList.toggle("t-exp", t === "exp");
  $("main").classList.toggle("t-inc", t === "inc");
  const ru = rateFor("USD");
  $("opUsd").title = t === "exp"
    ? "по курсу USDT из калькулятора" + (ru ? " (" + ru + ")" : "")
    : "по курсу ЦБ" + (ru ? " (" + ru + ")" : "");
  renderSugg(); loadDays();
}
function renderCats() {
  const box = $("cats");
  box.innerHTML = "";
  const list = (state.ref.categories || []).slice();
  if (selCat && !list.includes(selCat)) list.push(selCat);
  list.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = c;
    b.className = selCat === c ? "on" : "";
    b.onclick = () => { selCat = selCat === c ? "" : c; renderCats(); };
    box.appendChild(b);
  });
}
function renderSugg() {
  const q = String($("name").value || "").toLowerCase().trim();
  const src = (tab === "exp" ? state.ref.expense : state.ref.income) || [];
  const list = (q ? src.filter((x) => x.name.toLowerCase().includes(q)) : src).slice(0, 8);
  const box = $("sugg");
  box.innerHTML = "";
  list.forEach((x) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = x.name.length > 30 ? x.name.slice(0, 29) + "…" : x.name;
    if (x.rub) { const s = document.createElement("small"); s.textContent = fmt(x.rub) + "₽"; b.appendChild(s); }
    b.onclick = () => {
      $("name").value = x.name;
      if (x.category) selCat = x.category;
      renderCats(); renderSugg();
      if (!$("amount").value.trim()) $("amount").focus();
    };
    box.appendChild(b);
  });
}
$("name").addEventListener("input", renderSugg);
// Метка одна на запись: повторное нажатие по той же снимает её.
function renderFlags() {
  $("flagYellow").classList.toggle("on", selFlag === "yellow");
  $("flagRed").classList.toggle("on", selFlag === "red");
}
function setFlag(f) { selFlag = selFlag === f ? "" : f; renderFlags(); }

/* ── Добавление / правка ── */
async function addEntry() {
  const name = String($("name").value || "").trim();
  const raw = String($("amount").value || "").trim();
  const expr = isExpr(raw);
  const rub = expr ? calcExpr(raw) : parseFloat(raw.replace(/\s+/g, "").replace(",", "."));
  if (!name) { toast("Впишите наименование"); return; }
  if (expr && !(rub > 0)) { toast("Не могу посчитать выражение"); return; }
  if (!(rub > 0)) { toast("Впишите сумму"); return; }
  const body = {
    type: tab, name, rub,
    formula: expr ? normExpr(raw) : "",
    comment: $("comment").value.trim(), flag: selFlag,
    date: $("date").value || state.today,
    category: tab === "exp" ? selCat : "",
    cid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  };
  $("addBtn").disabled = true;
  try {
    const r = editId
      ? await api("/akfin/api/edit/" + editId, { method: "POST", body: JSON.stringify(body) })
      : await api("/akfin/api/add", { method: "POST", body: JSON.stringify(body) });
    if (!r.success) { toast(r.message || "Не получилось"); return; }
    toast(editId ? "Сохранено" : (tab === "exp" ? "Расход внесён" : "Приход внесён"));
    clearForm();
    window.scrollTo({ top: 0, behavior: "smooth" }); // после клавиатуры возвращаем экран на место
    await refresh();
  } catch (e) { if (String(e.message) !== "auth") toast("Ошибка сети"); }
  finally { $("addBtn").disabled = false; }
}
function clearForm() {
  editId = null; selCat = ""; selFlag = "";
  $("name").value = ""; $("amount").value = ""; $("comment").value = "";
  renderFlags(); updateRub(); renderCats(); renderSugg();
  $("addBtn").textContent = "Внести";
}

/* ── Записи (по умолчанию свёрнуты) ── */
function toggleRecords() {
  recordsOpen = !recordsOpen;
  $("records").style.display = recordsOpen ? "block" : "none";
  $("recToggle").textContent = recordsOpen ? "Скрыть" : "Записи ›";
  $("main").classList.toggle("hist", recordsOpen);
  if (recordsOpen) loadDays();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function loadDays() {
  if (!recordsOpen) return;
  try {
    const r = await api("/akfin/api/days?type=" + tab);
    const box = $("records");
    box.innerHTML = "";
    if (!r.days || !r.days.length) { box.innerHTML = '<div class="empty">Пока пусто</div>'; return; }
    r.days.forEach((d) => {
      const wrap = document.createElement("div");
      wrap.className = "day";
      const title = new Date(d.date + "T12:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
      wrap.innerHTML = "<h3>" + title + "<span>" + fmt(d.total) + " ₽</span></h3>";
      d.entries.forEach((e) => {
        ENTRIES[e.id] = e;
        const sw = document.createElement("div");
        sw.className = "swipe";
        sw.dataset.id = e.id;
        sw.innerHTML = '<button class="edit">Изменить</button><button class="del">Удалить</button>'
          + '<div class="rec"><div class="nm"><b></b><i></i></div><div class="am">' + fmt(e.rub) + ' ₽</div></div>';
        // метка — в ОДНОЙ строке с названием (как в личных финансах), а не отдельным кружком снизу
        const fl = e.flag === "yellow" ? "🟡 " : e.flag === "red" ? "🔴 " : "";
        sw.querySelector("b").textContent = fl + (e.comment ? e.name + " - " + e.comment : e.name);
        sw.querySelector("i").textContent = [e.category, e.formula].filter(Boolean).join(" · ");
        wrap.appendChild(sw);
      });
      box.appendChild(wrap);
    });
  } catch (e) {}
}
// ── свайп влево по записи → «Изменить» / «Удалить» ──
const ENTRIES = {}; // id → запись (нужна кнопке «Изменить»)
let swEl = null, swX = 0, swY = 0, swDx = 0, swMode = null;
function closeSwipes(except) {
  document.querySelectorAll(".swipe.open").forEach((s) => { if (s !== except) s.classList.remove("open"); });
}
document.addEventListener("touchstart", (ev) => {
  const s = ev.target.closest(".swipe");
  if (!s) { closeSwipes(); return; }
  swEl = s; swX = ev.touches[0].clientX; swY = ev.touches[0].clientY; swMode = null; swDx = 0;
}, { passive: true });
document.addEventListener("touchmove", (ev) => {
  if (!swEl) return;
  const dx = ev.touches[0].clientX - swX, dy = ev.touches[0].clientY - swY;
  if (swMode === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) swMode = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  if (swMode !== "h") return;
  closeSwipes(swEl);
  const base = swEl.classList.contains("open") ? -188 : 0;
  swDx = Math.min(0, Math.max(-200, base + dx));
  const row = swEl.querySelector(".rec");
  row.classList.add("drag");
  row.style.transform = "translateX(" + swDx + "px)";
}, { passive: true });
document.addEventListener("touchend", () => {
  if (!swEl) return;
  const row = swEl.querySelector(".rec");
  row.classList.remove("drag"); row.style.transform = "";
  if (swMode === "h") swEl.classList.toggle("open", swDx < -48);
  swEl = null; swMode = null; swDx = 0;
});
document.addEventListener("click", (ev) => {
  const ed = ev.target.closest(".swipe .edit");
  if (ed) { const e = ENTRIES[ed.closest(".swipe").dataset.id]; if (e) startEdit(e); closeSwipes(); return; }
  const dl = ev.target.closest(".swipe .del");
  if (dl) { const e = ENTRIES[dl.closest(".swipe").dataset.id]; if (e) delEntry(e); return; }
  if (!ev.target.closest(".swipe")) closeSwipes();
});

// Клавиатура iOS сдвигает экран: как только фокус ушёл со всех полей —
// возвращаем страницу наверх, чтобы форма снова встала на своё место.
document.addEventListener("focusout", () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (!a || (a.tagName !== "INPUT" && a.tagName !== "TEXTAREA")) window.scrollTo({ top: 0, behavior: "smooth" });
  }, 150);
});

function startEdit(e) {
  editId = e.id;
  $("name").value = e.name;
  $("amount").value = e.formula ? e.formula.replace(/\*/g, "×").replace(/\//g, "÷") : String(e.rub).replace(".", ",");
  $("comment").value = e.comment || "";
  $("date").value = e.date;
  selCat = e.category || ""; selFlag = e.flag || "";
  renderFlags(); updateRub(); renderCats();
  $("addBtn").textContent = "Сохранить";
  window.scrollTo({ top: 0, behavior: "smooth" });
  toast("Правка записи");
}
async function delEntry(e) {
  if (!confirm("Удалить «" + e.name + "»?")) return;
  try { await api("/akfin/api/delete/" + e.id, { method: "POST" }); toast("Удалено"); await refresh(); }
  catch (err) {}
}

/* ── Выгрузка таблицы (.xlsx, открывать в Numbers) ── */
async function downloadTable() {
  if (!token) { toast("Сначала войдите"); return; }
  $("dlBtn").disabled = true;
  try {
    const resp = await fetch("/akfin/api/export.xlsx?token=" + encodeURIComponent(token));
    if (!resp.ok) { toast("Не удалось собрать файл"); return; }
    const blob = await resp.blob();
    const file = new File([blob], "Рабочие финансы.xlsx", { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    // в PWA обычная ссылка не работает — отдаём через «Поделиться» (→ Numbers)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) {}
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "Рабочие финансы.xlsx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { toast("Не получилось, попробуйте ещё раз"); }
  finally { $("dlBtn").disabled = false; }
}

/* ── Обновление ── */
async function refresh() {
  try {
    const r = await api("/akfin/api/state");
    if (!r.success) return;
    state = Object.assign(state, r);
    if (!$("date").value) $("date").value = r.today;
    renderRates(); renderCats(); renderSugg();
    try {
      const b = await (await fetch("/akfin/api/bio/has", { method: "POST" })).json();
      $("bioEnroll").classList.toggle("hide", !!(b && b.has));
    } catch (e) {}
    await loadDays();
  } catch (e) {}
}

/* ── Старт ── */
(async function init() {
  setTab("exp");
  if (token) { showMain(); await refresh(); }
  else { showLogin(); }
})();
</script>
