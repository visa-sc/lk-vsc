<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Investments">
<meta name="theme-color" content="#f2f5f9">
<link rel="apple-touch-icon" href="/fin-icon.png">
<title>Life Investments</title>
<style>
/* Светлый «воздушный» скин в духе клиентского ЛК (#3589BD, мягкие тени) */
:root{
  --bg:#f2f5f9; --card:#ffffff; --line:rgba(23,32,60,.08);
  --ink:#171c29; --muted:#6a7385; --faint:#9aa3b2;
  --acc:#3589BD;
  --pos:#34c759; --ok:#3589BD; --nope:#ff9500; --trash:#ff3b30;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 14px 34px -18px rgba(16,32,64,.20);
  --shadow-hi:0 2px 6px rgba(16,24,40,.06), 0 26px 50px -22px rgba(16,32,64,.30);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#f7fafd 0%,#f2f5f9 45%,#edf1f7 100%)}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 48px}
/* форма опущена ближе к середине экрана (просьба Андрея) */
#main .spacer{height:max(18vh, calc(env(safe-area-inset-top) + 72px))}
.muted{color:var(--muted);font-size:13px}
.tiny{color:var(--faint);font-size:12px}
/* ── вход ── */
#login{display:none;flex-direction:column;gap:16px;align-items:center;padding-top:26vh}
#login input{font-size:26px;text-align:center;letter-spacing:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:14px 10px;width:220px;outline:none;box-shadow:var(--shadow)}
#login button{font-size:17px;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:16px;padding:14px 44px;box-shadow:var(--shadow)}
#login #bioBtn{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.err{color:var(--trash);font-size:14px;min-height:18px}
/* ── форма ── */
#main{display:none}
.toprow{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:26px;padding-top:calc(env(safe-area-inset-top) + 8px)}
#bioEnroll{background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px;padding:6px 13px;box-shadow:var(--shadow)}
/* операторы − + × ÷ справа над суммой: подставляются в поле, сумма считается выражением */
.curr{display:flex;gap:7px;margin-bottom:10px;justify-content:flex-end}
.mathbtn{width:44px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;font-weight:600;flex:0 0 auto;box-shadow:var(--shadow)}
.mathbtn:active{background:var(--bg)}
.amount-row .rub{white-space:nowrap}
.amount-row .rub.calc{font-size:15px;font-weight:600;color:var(--muted)}
.amount-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 20px;box-shadow:var(--shadow-hi)}
.amount-row input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-size:38px;font-weight:700;min-width:0}
.amount-row input::placeholder{color:#c3cad6}
.amount-row .rub{font-size:26px;color:var(--faint);font-weight:600}
.name-row{margin-top:12px}
.name-row input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);font-size:17px;padding:14px 16px;outline:none;box-shadow:var(--shadow)}
.name-row input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:9px 15px;font-size:14px;color:var(--ink);display:flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
.chip b{font-weight:600}
.chip .c-amt{color:var(--faint);font-size:12px}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.bk{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;font-size:13.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.bk small{display:block;font-weight:400;font-size:10.5px;margin-top:2px;color:var(--faint)}
.bk[data-b="pos"].sel{background:rgba(52,199,89,.10);border-color:var(--pos);color:#1e9e46}
.bk[data-b="ok"].sel{background:rgba(53,137,189,.10);border-color:var(--ok);color:var(--ok)}
.bk[data-b="nope"].sel{background:rgba(255,149,0,.10);border-color:var(--nope);color:#cc7a00}
.bk[data-b="trash"].sel{background:rgba(255,59,48,.08);border-color:var(--trash);color:var(--trash)}
.meta-row{display:flex;gap:8px;margin-top:12px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:9px 15px;font-size:13.5px;color:var(--muted);box-shadow:var(--shadow)}
input.pill{outline:none;color:var(--ink)}
input.pill::placeholder{color:var(--faint)}
.flagbtn{cursor:pointer;user-select:none;white-space:nowrap;padding:9px 12px}
#date{min-width:106px;font-size:13px;padding:9px 10px}
.flagbtn.on{color:var(--ink);border-color:var(--nope);background:rgba(255,149,0,.08)}
#flagR.on{border-color:var(--trash);background:rgba(255,59,48,.06)}
#saveBtn{width:100%;margin-top:16px;background:var(--acc);border:0;border-radius:18px;color:#fff;font-size:18px;font-weight:700;padding:16px;box-shadow:var(--shadow-hi)}
#saveBtn:disabled{opacity:.4}
#saveBtn.flash{background:var(--pos)}
/* ── записи (спрятаны по умолчанию) ── */
.recline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:0 4px;flex-wrap:wrap}
.recline-right{display:flex;align-items:center;gap:8px}
#dlBtn{background:#fff;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1;
  padding:9px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;-webkit-appearance:none;appearance:none}
#dlBtn:active{background:#f2f4f8}
#recToggle{background:none;border:0;color:var(--faint);font-size:13px;padding:6px 0}
#records{display:none;margin-top:4px}
.sec h2{font-size:14px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:0 4px}
.sec h2 .sum{color:var(--ink)}
/* свайп влево по записи → кнопка «Удалить» под строкой */
.swipe{position:relative;margin-top:8px}
.swipe .del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;border-radius:14px;background:var(--trash);color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s}
.swipe.open .del{opacity:1;pointer-events:auto}
.swipe .entry{margin-top:0;transition:transform .18s;touch-action:pan-y}
.swipe.open .entry{transform:translateX(-96px)}
.swipe .entry.drag{transition:none}
.entry{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:8px;box-shadow:var(--shadow)}
.entry .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dot.pos{background:var(--pos)}.dot.ok{background:var(--ok)}.dot.nope{background:var(--nope)}.dot.trash{background:var(--trash)}
.entry .nm{flex:1;min-width:0}
.entry .nm b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm b .cmt{font-weight:400;color:var(--muted)}
.entry .nm span{font-size:11.5px;color:var(--faint)}
.entry .amt{font-size:15px;font-weight:700;white-space:nowrap}
.entry .st{font-size:13px;width:20px;text-align:center;color:var(--faint)}
.entry.pending{border-style:dashed}
#daysBtn{background:none;border:0;color:var(--acc);font-size:14px;padding:8px 4px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(90px);background:rgba(23,28,41,.92);color:#fff;padding:11px 22px;border-radius:22px;font-size:14px;transition:transform .25s;z-index:9;box-shadow:var(--shadow-hi)}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <div style="font-size:40px">🔒</div>
    <button id="bioBtn" style="display:none" onclick="bioLogin()">Face ID</button>
    <input id="code" type="tel" inputmode="numeric" autocomplete="one-time-code" placeholder="Код">
    <div class="err" id="loginErr"></div>
    <button onclick="doLogin()">Войти</button>
  </div>

  <div id="main">
    <div class="toprow">
      <button id="bioEnroll" style="display:none" onclick="bioRegister()">Включить Face ID</button>
    </div>
    <div class="spacer"></div>

    <div class="curr" id="currRow">
      <button class="mathbtn" onmousedown="event.preventDefault()" onclick="insMath('-')">−</button>
      <button class="mathbtn" onmousedown="event.preventDefault()" onclick="insMath('+')">+</button>
      <button class="mathbtn" onmousedown="event.preventDefault()" onclick="insMath('*')">×</button>
      <button class="mathbtn" onmousedown="event.preventDefault()" onclick="insMath('/')">÷</button>
    </div>
    <div class="amount-row">
      <input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
      <span class="rub" id="rubSign">₽</span>
    </div>

    <div class="name-row">
      <input id="name" type="text" placeholder="Что купил" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>

    <div class="buckets" id="buckets">
      <div class="bk" data-b="pos">Позитивные<small>инвестиции в себя</small></div>
      <div class="bk sel" data-b="ok">Допустимые<small>обычная жизнь</small></div>
      <div class="bk" data-b="nope">Можно было не тратить<small>импульсивное</small></div>
      <div class="bk" data-b="trash">Выброшенные<small>штрафы, потери</small></div>
    </div>

    <div class="meta-row">
      <div class="pill flagbtn" id="flagY" onclick="toggleFlag('yellow')">🟡 разобраться</div>
      <div class="pill flagbtn" id="flagR" onclick="toggleFlag('red')">🔴 вернуть</div>
      <input id="date" type="date" class="pill" style="flex:1;min-width:90px">
    </div>
    <div class="meta-row">
      <input id="comment" class="pill" style="flex:1" placeholder="Комментарий" autocomplete="off">
    </div>
    <!-- категория проставляется сама по названию, на экране её нет -->
    <input type="hidden" id="category" value="">

    <button id="saveBtn" onclick="saveEntry()">Внести</button>

    <div class="recline">
      <span class="tiny" id="totalInfo"></span>
      <span class="recline-right">
        <button id="dlBtn" onclick="downloadTable()">Скачать таблицу</button>
        <button id="recToggle" onclick="toggleRecords()">Записи ›</button>
      </span>
    </div>
    <div id="records">
      <div class="sec">
        <h2><span>Сегодня</span><span class="sum" id="todaySum"></span></h2>
        <div id="todayList"></div>
        <div style="text-align:right"><button id="daysBtn" onclick="toggleDays()">История ›</button></div>
      </div>
      <div class="sec" id="days" style="display:none"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const LS_TOKEN = "finToken";
let token = localStorage.getItem(LS_TOKEN) || "";
let FREQ = [], TODAY = "";
let daysOpen = false, recordsOpen = false;

const $ = (id) => document.getElementById(id);
const fmt = (n) => new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(n);

async function api(path, opts = {}) {
  opts.headers = Object.assign({ "Content-Type": "application/json", Authorization: "Bearer " + token }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401 && !path.endsWith("/login")) { showLogin(); throw new Error("auth"); }
  return r.json();
}

function showLogin() { $("login").style.display = "flex"; $("main").style.display = "none"; updateBioBtn(); }
function showMain() {
  $("login").style.display = "none"; $("main").style.display = "block";
  $("bioEnroll").style.display = localStorage.getItem("finBio") ? "none" : "";
  // ключ Face ID живёт в связке ключей и переживает переустановку иконки:
  // если на сервере он уже есть — не предлагать «включить», а сразу помнить
  if (!localStorage.getItem("finBio") && window.PublicKeyCredential) {
    fetch("/fin/api/bio/has", { method: "POST" }).then((r) => r.json()).then((r) => {
      if (r.has) { localStorage.setItem("finBio", "1"); $("bioEnroll").style.display = "none"; }
    }).catch(() => {});
  }
}

// ── Face ID (WebAuthn) ──
const b2a = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const a2b = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
async function updateBioBtn() {
  try {
    if (!window.PublicKeyCredential) return;
    const r = await (await fetch("/fin/api/bio/has", { method: "POST" })).json();
    $("bioBtn").style.display = r.has ? "" : "none";
  } catch (e) {}
}
async function bioLogin() {
  try {
    const opts = await (await fetch("/fin/api/bio/auth-options", { method: "POST" })).json();
    if (!opts.challenge) return false;
    opts.challenge = b2a(opts.challenge);
    (opts.allowCredentials || []).forEach((c) => { c.id = b2a(c.id); });
    const cred = await navigator.credentials.get({ publicKey: opts });
    const payload = {
      id: cred.id, rawId: a2b(cred.rawId), type: cred.type,
      response: {
        clientDataJSON: a2b(cred.response.clientDataJSON),
        authenticatorData: a2b(cred.response.authenticatorData),
        signature: a2b(cred.response.signature),
        userHandle: cred.response.userHandle ? a2b(cred.response.userHandle) : null,
      },
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
    };
    const r = await (await fetch("/fin/api/bio/auth-verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ assertionResponse: payload }) })).json();
    if (!r.success) { $("loginErr").textContent = r.message || "Не получилось"; return false; }
    token = r.token; localStorage.setItem(LS_TOKEN, token); localStorage.setItem("finBio", "1");
    showMain(); await refresh();
    return true;
  } catch (e) { return false; } // отмена Face ID — просто остаёмся на коде
}
async function bioRegister() {
  try {
    const opts = await api("/fin/api/bio/register-options", { method: "POST" });
    if (!opts.challenge) { toast(opts.message || "Ошибка"); return; }
    opts.challenge = b2a(opts.challenge);
    opts.user.id = new TextEncoder().encode("fin-owner");
    (opts.excludeCredentials || []).forEach((c) => { c.id = b2a(c.id); });
    const cred = await navigator.credentials.create({ publicKey: opts });
    const payload = {
      id: cred.id, rawId: a2b(cred.rawId), type: cred.type,
      response: { clientDataJSON: a2b(cred.response.clientDataJSON), attestationObject: a2b(cred.response.attestationObject) },
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
    };
    const r = await api("/fin/api/bio/register-verify", { method: "POST", body: JSON.stringify({ attestationResponse: payload }) });
    if (r.success) { localStorage.setItem("finBio", "1"); $("bioEnroll").style.display = "none"; toast("Face ID включён"); }
    else toast(r.message || "Не получилось");
  } catch (e) {
    if (String(e.message) === "auth") return;
    // ключ уже зарегистрирован на этом устройстве — просто вспоминаем его
    if (e && e.name === "InvalidStateError") {
      localStorage.setItem("finBio", "1"); $("bioEnroll").style.display = "none";
      toast("Face ID уже был включён");
    } else toast("Face ID отменён");
  }
}

async function doLogin() {
  $("loginErr").textContent = "";
  try {
    const r = await api("/fin/api/login", { method: "POST", body: JSON.stringify({ code: $("code").value.trim() }) });
    if (!r.success) { $("loginErr").textContent = r.message || "Ошибка"; return; }
    token = r.token; localStorage.setItem(LS_TOKEN, token);
    showMain(); await refresh();
  } catch (e) { $("loginErr").textContent = "Ошибка сети"; }
}
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

// ── корзины ──
let bucket = "ok";
$("buckets").addEventListener("click", (e) => {
  const b = e.target.closest(".bk"); if (!b) return;
  bucket = b.dataset.b;
  document.querySelectorAll(".bk").forEach((x) => x.classList.toggle("sel", x === b));
});
function setBucket(b) {
  bucket = b;
  document.querySelectorAll(".bk").forEach((x) => x.classList.toggle("sel", x.dataset.b === b));
}

// ── сумма может быть выражением: «45*79.8» (валюта по курсу), «3540/2» (пополам).
// Такая запись уходит в таблицу ФОРМУЛОЙ, рядом с полем — живой итог в рублях.
function insMath(ch) {
  const a = $("amount");
  a.value += ch;
  a.focus();
  updateRub();
}
function normExpr(s) {
  return String(s || "").replace(/,/g, ".").replace(/\s+/g, "").replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
}
function calcExpr(s) {
  s = normExpr(s);
  if (!s || !/^[0-9.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return(' + s + ')')(); return isFinite(v) ? v : NaN; } catch (e) { return NaN; }
}
function isExpr(s) { return /[+\-*/×÷]/.test(normExpr(s).slice(1)); } // минус первым знаком — не выражение
function updateRub() {
  const el = $("rubSign");
  const raw = $("amount").value;
  if (!isExpr(raw)) { el.textContent = "₽"; el.classList.remove("calc"); return; }
  const v = calcExpr(raw);
  el.textContent = v > 0 ? "= " + fmt(Math.round(v * 100) / 100) + " ₽" : "₽";
  el.classList.add("calc");
}
$("amount").addEventListener("input", updateRub);

// ── метки ──
let flag = "";
function toggleFlag(f) {
  flag = flag === f ? "" : f;
  $("flagY").classList.toggle("on", flag === "yellow");
  $("flagR").classList.toggle("on", flag === "red");
}

// ── частые покупки ──
function renderChips(filter) {
  const f = (filter || "").toLowerCase().trim();
  const list = FREQ.filter((x) => !f || x.name.toLowerCase().includes(f)).slice(0, 20);
  $("chips").innerHTML = list.map((x) =>
    `<div class="chip" data-i="${FREQ.indexOf(x)}"><b>${esc(x.name)}</b><span class="c-amt">${fmt(x.amount)}₽</span></div>`
  ).join("");
}
$("chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  const x = FREQ[Number(c.dataset.i)]; if (!x) return;
  $("name").value = x.name;
  if (!$("amount").value) $("amount").value = String(x.amount);
  setBucket(x.bucket);
  $("category").value = x.category || "";
  $("amount").focus(); $("amount").select();
});
$("name").addEventListener("input", () => {
  renderChips($("name").value);
  const hit = FREQ.find((x) => x.name.toLowerCase() === $("name").value.toLowerCase().trim());
  if (hit) { setBucket(hit.bucket); $("category").value = hit.category || ""; }
  else $("category").value = "";
});
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ── офлайн-очередь: без связи записи копятся в localStorage и уходят сами ──
function getQueue() { try { return JSON.parse(localStorage.getItem("finQueue") || "[]"); } catch (e) { return []; } }
function setQueue(q) { localStorage.setItem("finQueue", JSON.stringify(q)); }
let flushing = false;
async function flushQueue() {
  if (flushing || !token) return;
  const q0 = getQueue();
  if (!q0.length) return;
  flushing = true;
  try {
    for (const item of q0) {
      let r;
      try { r = await api("/fin/api/add", { method: "POST", body: JSON.stringify(item) }); }
      catch (e) { if (String(e.message) === "auth") return; break; } // нет связи — позже
      // успех или отказ сервера (в т.ч. дубль) — из очереди убираем
      setQueue(getQueue().filter((x) => x.cid !== item.cid));
      if (!r.success) toast("Запись не принята: " + (r.message || ""));
    }
    if (!getQueue().length) refresh().catch(() => {});
  } finally { flushing = false; }
}
window.addEventListener("online", () => flushQueue());
setInterval(() => flushQueue().catch(() => {}), 20000);

function clearForm() {
  $("amount").value = ""; $("name").value = ""; setBucket("ok"); $("category").value = ""; $("comment").value = ""; toggleFlag(flag); updateRub(); renderChips("");
  $("saveBtn").classList.add("flash"); $("saveBtn").textContent = "Внесено ✓";
  setTimeout(() => { $("saveBtn").classList.remove("flash"); $("saveBtn").textContent = "Внести"; }, 900);
}

// ── сохранение ──
async function saveEntry() {
  const raw = $("amount").value.trim();
  const expr = isExpr(raw);
  const amount = expr ? calcExpr(raw) : parseFloat(raw.replace(",", "."));
  const formula = expr ? normExpr(raw) : "";
  const name = $("name").value.trim();
  if (!name) { toast("Заполни название"); return; }
  if (expr && !(amount > 0)) { toast("Не могу посчитать выражение"); return; }
  // с меткой 🟡/🔴 можно без суммы — уйдёт строкой-заметкой
  if (!(amount > 0) && !flag) { toast("Заполни сумму и название"); return; }
  const payload = {
    name, amount: amount > 0 ? Math.round(amount * 100) / 100 : 0, formula, bucket,
    category: $("category").value, date: $("date").value, flag, comment: $("comment").value.trim(),
    cid: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2)),
    at: Date.now(),
  };
  $("saveBtn").disabled = true;
  try {
    // не даём интерфейсу «тупить»: 6 секунд на попытку, дальше — офлайн-очередь
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    let r;
    try {
      r = await api("/fin/api/add", { method: "POST", body: JSON.stringify(payload), signal: ctrl.signal });
    } finally { clearTimeout(timer); }
    if (!r.success) { toast(r.message || "Ошибка"); return; }
    clearForm();
    await refresh();
  } catch (e) {
    if (String(e.message) === "auth") return;
    // нет связи: фиксируем локально, уйдёт само при появлении интернета
    setQueue(getQueue().concat([payload]));
    clearForm();
    toast("Нет связи — сохранено, уйдёт само");
    renderToday(lastState);
  } finally { $("saveBtn").disabled = false; }
}

// ── записи ──
function toggleRecords() {
  recordsOpen = !recordsOpen;
  $("records").style.display = recordsOpen ? "block" : "none";
  $("recToggle").textContent = recordsOpen ? "Скрыть" : "Записи ›";
}
// 1 запись · 2 записи · 5 записей (11–14 — «записей»)
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function entryRow(e, showDate) {
  const fl = e.flag === "yellow" ? "🟡 " : e.flag === "red" ? "🔴 " : "";
  const nm = esc(e.name) + (e.comment ? ` <span class="cmt">- ${esc(e.comment)}</span>` : "");
  return `<div class="swipe" data-id="${e.id}">
    <button class="del">Удалить</button>
    <div class="entry${e.pending ? " pending" : ""}">
      <div class="dot ${e.bucket}"></div>
      <div class="nm"><b>${fl}${nm}</b><span>${showDate ? e.date : ""}</span></div>
      <div class="amt">${e.amount > 0 ? fmt(e.amount) + " ₽" : ""}</div>
    </div>
  </div>`;
}

// ── свайп влево по записи → «Удалить» (сегодня и история) ──
let swEl = null, swX = 0, swY = 0, swDx = 0, swMode = null;
function closeSwipes(except) { document.querySelectorAll(".swipe.open").forEach((s) => { if (s !== except) s.classList.remove("open"); }); }
document.addEventListener("touchstart", (ev) => {
  const s = ev.target.closest(".swipe");
  if (!s) { closeSwipes(); return; }
  swEl = s; swX = ev.touches[0].clientX; swY = ev.touches[0].clientY; swMode = null; swDx = 0;
}, { passive: true });
document.addEventListener("touchmove", (ev) => {
  if (!swEl) return;
  const dx = ev.touches[0].clientX - swX, dy = ev.touches[0].clientY - swY;
  if (swMode === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) swMode = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  if (swMode !== "h") return;
  closeSwipes(swEl);
  const base = swEl.classList.contains("open") ? -96 : 0;
  swDx = Math.min(0, Math.max(-110, base + dx));
  const en = swEl.querySelector(".entry");
  en.classList.add("drag");
  en.style.transform = `translateX(${swDx}px)`;
}, { passive: true });
document.addEventListener("touchend", () => {
  if (!swEl) return;
  const en = swEl.querySelector(".entry");
  en.classList.remove("drag"); en.style.transform = "";
  if (swMode === "h") swEl.classList.toggle("open", swDx < -48);
  swEl = null; swMode = null; swDx = 0;
});
document.addEventListener("click", async (ev) => {
  const del = ev.target.closest(".swipe .del");
  if (!del) { if (!ev.target.closest(".swipe")) closeSwipes(); return; }
  const s = del.closest(".swipe");
  // запись из офлайн-очереди — удаляем локально, на сервере её ещё нет
  if (s.dataset.id.indexOf("local-") === 0) {
    setQueue(getQueue().filter((x) => "local-" + x.cid !== s.dataset.id));
    toast("Удалено"); renderToday(lastState);
    return;
  }
  del.disabled = true;
  try {
    const r = await api("/fin/api/delete/" + s.dataset.id, { method: "POST" });
    if (r.success) { toast("Удалено"); await refresh(); if (daysOpen) await loadDays(); }
    else { del.disabled = false; toast(r.message || "Ошибка"); }
  } catch (e) { del.disabled = false; if (String(e.message) !== "auth") toast("Нет связи — удалить можно онлайн"); }
});

let lastState = null;
function renderToday(r) {
  const es = (r && r.entries || []).slice();
  // офлайн-очередь показываем сразу, пунктиром (ещё не на сервере)
  const q = getQueue().map((i) => ({ ...i, id: "local-" + i.cid, pending: true }));
  const all = es.concat(q);
  $("todaySum").textContent = all.length ? fmt(all.reduce((s, e) => s + (e.amount || 0), 0)) + " ₽" : "";
  $("todayList").innerHTML = all.length
    ? all.slice().reverse().map((e) => entryRow(e)).join("")
    : `<div class="tiny" style="padding:10px 4px">Пока пусто</div>`;
  const total = (r && r.total || 0) + q.length;
  $("totalInfo").textContent = total ? `${total} ${plural(total, "запись", "записи", "записей")} всего` : "";
}
async function refresh() {
  let r;
  try {
    r = await api("/fin/api/state");
    if (!r.success) return;
    localStorage.setItem("finCache", JSON.stringify(r));
  } catch (e) {
    if (String(e.message) === "auth") throw e;
    // офлайн: рисуем из кэша + очереди, приложение не тупит
    try { r = JSON.parse(localStorage.getItem("finCache") || "null"); } catch (_) { r = null; }
    if (!r) { renderToday(null); return; }
  }
  lastState = r;
  FREQ = r.frequent || []; TODAY = r.today;
  if (!$("date").value || $("date").value === $("date").dataset.auto) {
    $("date").value = TODAY; $("date").dataset.auto = TODAY;
  }
  renderChips($("name").value);
  renderToday(r);
}

// Выгрузка таблицы: .xlsx с раскладкой листа «Личные финансы» (открывается в Numbers).
// В PWA файл нельзя просто «открыть ссылкой»: прямой переход застревает на
// системном превью без «назад», отдельное окно — белый экран (встроенный Safari
// не умеет ни качать, ни рендерить xlsx). Поэтому качаем файл фоном и зовём
// системное «Поделиться» → «Open in Numbers» / «Сохранить в Файлы».
async function downloadTable() {
  const t = token || "";
  if (!t) { toast("Сначала войдите"); return; }
  $("dlBtn").disabled = true;
  try {
    const resp = await fetch("/fin/api/export.xlsx?token=" + encodeURIComponent(t));
    if (!resp.ok) { toast("Не удалось собрать файл"); return; }
    const blob = await resp.blob();
    const file = new File([blob], "Личные финансы.xlsx", { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) {} // отмена шэринга — не ошибка
      return;
    }
    // фолбэк для обычного браузера: скачать как файл
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "Личные финансы.xlsx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { toast("Не получилось, попробуй ещё раз"); }
  finally { $("dlBtn").disabled = false; }
}

async function loadDays() {
  const r = await api("/fin/api/days");
  if (!r.success) return;
  $("days").innerHTML = (r.days || []).filter((d) => d.date !== TODAY).map((d) =>
    `<h2><span>${d.date}</span><span class="sum">${fmt(d.total)} ₽</span></h2>`
    + d.entries.slice().reverse().map((e) => entryRow(e)).join("")
  ).join("") || `<div class="tiny">Истории пока нет</div>`;
}
async function toggleDays() {
  daysOpen = !daysOpen;
  $("days").style.display = daysOpen ? "block" : "none";
  $("daysBtn").textContent = daysOpen ? "Свернуть" : "История ›";
  if (daysOpen) await loadDays();
}

function toast(t) {
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}

setInterval(() => { if ($("main").style.display === "block" && !document.hidden) refresh().catch(() => {}); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) refresh().catch(() => {}); });

// офлайн-оболочка: страница и иконка кэшируются, открывается без сети
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/fin-sw.js", { scope: "/fin" }).catch(() => {});

(async function init() {
  if (token) {
    try { showMain(); await refresh(); flushQueue().catch(() => {}); return; }
    catch (e) { if (String(e.message) !== "auth") return; }
  }
  showLogin();
  // как в админке: сразу пробуем биометрию, БЕЗ предварительных whoami-запросов
  if (localStorage.getItem("finBio") && window.PublicKeyCredential) bioLogin();
})();
</script>
