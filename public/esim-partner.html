<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Партнёрский кабинет — VOYO mobile</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root{ --ink:#16202e; --mut:#6e7c91; --mut2:#9aa3b3; --line:#e6ebf2; --accent:#3589bd; --accent-d:#2c6f96;
         --green:#2a8f6a; --grad:linear-gradient(135deg,#4aa3d4,#2c6f96); }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
       background:linear-gradient(180deg,#f7f9fc 0%,#eef1f6 100%);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:0 18px 60px;}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px;flex-wrap:wrap;gap:10px;}
  .brand{display:inline-flex;flex-direction:column;text-decoration:none;color:var(--ink);}
  .brandrow{display:flex;align-items:center;gap:9px;}
  .brandrow img{height:19px;display:block;}
  .wm{font-size:20px;font-weight:300;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  h1{font-size:26px;letter-spacing:-.02em;margin:18px 0 4px;}
  .lead{color:var(--mut);font-size:14.5px;line-height:1.55;margin:0 0 20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px;
        box-shadow:0 18px 40px -30px rgba(16,24,40,.35);}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .tile{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfcfe;}
  .tile .k{font-size:11.5px;color:var(--mut);margin-bottom:6px;}
  .tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .tile .v small{font-size:12px;font-weight:500;color:var(--mut2);margin-left:4px;}
  .tile.acc{background:var(--grad);border-color:transparent;color:#fff;}
  .tile.acc .k{color:rgba(255,255,255,.85);}
  h2{font-size:16.5px;margin:0 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:0 10px 8px 0;white-space:nowrap;}
  td{padding:9px 10px 9px 0;border-top:1px solid var(--line);}
  td.r,th.r{text-align:right;padding-right:0;}
  .mono{font-family:SFMono-Regular,Consolas,monospace;font-size:13px;}
  .dim{color:var(--mut2);}
  .gate{max-width:360px;margin:80px auto;}
  .gate input{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px;background:#fff;}
  .gate button{width:100%;height:46px;margin-top:10px;border:0;border-radius:14px;background:var(--grad);color:#fff;
               font:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  .err{color:#b4322c;font-size:13.5px;margin-top:10px;display:none;}
  .err.on{display:block;}
  .foot{margin-top:22px;text-align:center;color:var(--mut2);font-size:12.5px;line-height:1.6;}
  .foot a{color:var(--accent);text-decoration:none;}
  .codebox{display:inline-block;font-family:SFMono-Regular,Consolas,monospace;font-size:19px;font-weight:700;
           letter-spacing:.12em;background:#f2f7fb;border:1px solid #dbe6f0;border-radius:12px;padding:9px 18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <a class="brand" href="/esim">
      <span class="brandrow"><img src="/voyo-logo.png" alt="VOYO" /><span class="wm">mobile</span></span>
    </a>
    <span class="dim" id="who"></span>
  </div>

  <div id="gate" class="gate card">
    <h2>Партнёрский кабинет</h2>
    <p class="lead" style="margin-bottom:14px">Введите пароль, чтобы посмотреть статистику по вашему промокоду.</p>
    <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password" />
    <button id="go" type="button">Войти</button>
    <div class="err" id="err">Неверный пароль</div>
  </div>

  <div id="app" style="display:none">
    <h1 id="title">Партнёрский кабинет</h1>
    <p class="lead" id="sub"></p>

    <div class="card">
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="card">
      <h2>Ваш промокод</h2>
      <p><span class="codebox" id="code"></span></p>
      <p class="lead" id="how" style="margin:12px 0 0"></p>
    </div>

    <div class="card">
      <h2>Клиенты по вашему коду</h2>
      <div style="overflow:auto"><table id="tClients"></table></div>
    </div>

    <div class="card">
      <h2>Начисления по покупкам</h2>
      <div style="overflow:auto"><table id="tLog"></table></div>
    </div>

    <div class="card" id="payCard" style="display:none">
      <h2>Выплаты</h2>
      <div style="overflow:auto"><table id="tPay"></table></div>
    </div>
  </div>

  <div class="foot">
    <a href="/esim">VOYO mobile — пакеты eSIM для поездок</a><br/>
    Вопросы по начислениям: <a href="mailto:director@visa-sc.ru">director@visa-sc.ru</a>
  </div>
</div>

<script>
(function(){
  "use strict";
  var slug = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
  var KEY = "voyo_partner_" + slug;
  var el = function(id){ return document.getElementById(id); };
  var RU = function(n){ return (Math.round(Number(n)||0)).toLocaleString("ru-RU"); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); };
  var d = function(ts){ if(!ts) return "—"; var x = new Date(ts + 3*3600e3).toISOString();
    return (+x.slice(8,10)) + "." + x.slice(5,7) + "." + x.slice(2,4); };

  function plural(n, f){ var a=Math.abs(n)%100, b=a%10; return (a>10&&a<20)?f[2]:(b>1&&b<5)?f[1]:b===1?f[0]:f[2]; }

  async function load(pass){
    var r = await fetch("/esim/api/partner/" + encodeURIComponent(slug) + "?pass=" + encodeURIComponent(pass), { cache: "no-store" });
    if (r.status === 403) return null;
    var j = await r.json();
    return j && j.success ? j.stats : null;
  }

  function render(s){
    el("gate").style.display = "none";
    el("app").style.display = "";
    el("who").textContent = s.name;
    el("title").textContent = "Кабинет партнёра: " + s.name;
    el("sub").textContent = "Вы получаете " + s.pct + "% с каждой покупки клиентов, пришедших по вашему коду. " +
      "Клиенту по коду начисляется " + RU(s.bonusRub) + " ₽ на счёт VOYO mobile.";
    el("code").textContent = s.code;
    el("how").innerHTML = "Клиент вводит код в поле «У меня есть промокод» при оплате eSIM на <b>voyomobile.ru</b>. " +
      "Цена для него не меняется, а " + RU(s.bonusRub) + " ₽ падают ему на счёт и спишутся со следующей покупки. " +
      "Ваш процент начисляется и за первую покупку, и за все следующие покупки этого клиента, даже если код он больше не вводит.";
    el("tiles").innerHTML = [
      tile("Заработано всего", RU(s.earnedRub), "₽", "acc"),
      tile("В этом месяце", RU(s.earnedMonth), "₽"),
      tile("К выплате", RU(s.dueRub), "₽"),
      tile("Клиентов", RU(s.clientCount), plural(s.clientCount, ["человек","человека","человек"])),
      tile("Покупок", RU(s.orders), plural(s.orders, ["штука","штуки","штук"])),
      tile("Оборот клиентов", RU(s.spentRub), "₽"),
    ].join("");

    el("tClients").innerHTML = "<thead><tr><th>Клиент</th><th>Первая покупка</th><th class=r>Покупок</th>" +
      "<th class=r>Купил на</th><th class=r>Ваши " + s.pct + "%</th></tr></thead><tbody>" +
      (s.clients.length ? s.clients.map(function(c){
        return "<tr><td class=mono>" + esc(c.key) + "</td><td>" + d(c.firstAt) + "</td>" +
          "<td class=r>" + RU(c.orders) + "</td><td class=r>" + RU(c.spentRub) + " ₽</td>" +
          "<td class=r><b>" + RU(c.earnedRub) + " ₽</b></td></tr>";
      }).join("") : "<tr><td colspan=5 class=dim>Пока никто не купил по вашему коду.</td></tr>") + "</tbody>";

    el("tLog").innerHTML = "<thead><tr><th>Когда</th><th>Клиент</th><th>Пакет</th><th class=r>Сумма</th><th class=r>Начислено</th></tr></thead><tbody>" +
      (s.log.length ? s.log.map(function(l){
        return "<tr><td>" + d(l.ts) + "</td><td class=mono>" + esc(l.cust) + "</td>" +
          "<td>" + esc(l.label || "eSIM") + "</td><td class=r>" + RU(l.amountRub) + " ₽</td>" +
          "<td class=r><b>" + RU(l.earnedRub) + " ₽</b></td></tr>";
      }).join("") : "<tr><td colspan=5 class=dim>Начислений пока нет.</td></tr>") + "</tbody>";

    if (s.payouts && s.payouts.length){
      el("payCard").style.display = "";
      el("tPay").innerHTML = "<thead><tr><th>Когда</th><th>Комментарий</th><th class=r>Сумма</th></tr></thead><tbody>" +
        s.payouts.map(function(p){ return "<tr><td>" + d(p.ts) + "</td><td>" + esc(p.note || "—") + "</td>" +
          "<td class=r>" + RU(p.rub) + " ₽</td></tr>"; }).join("") + "</tbody>";
    }
  }
  function tile(k, v, unit, cls){
    return '<div class="tile ' + (cls||"") + '"><div class="k">' + k + '</div><div class="v">' + v +
      '<small>' + unit + '</small></div></div>';
  }

  async function tryPass(pass){
    var s = await load(pass);
    if (!s){ el("err").classList.add("on"); return false; }
    try{ sessionStorage.setItem(KEY, pass); }catch(e){}
    render(s);
    return true;
  }
  el("go").addEventListener("click", function(){ tryPass(el("pass").value.trim()); });
  el("pass").addEventListener("keydown", function(e){ if (e.key === "Enter") el("go").click(); });

  var saved = "";
  try{ saved = sessionStorage.getItem(KEY) || ""; }catch(e){}
  if (saved) tryPass(saved); else el("pass").focus();
})();
</script>
</body>
</html>
