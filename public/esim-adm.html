<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>VOYO mobile — показатели</title>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  /* Оформление — как у дашборда VSC (/vsc, body.vsc-skin): мягкий фон,
     белые карточки с крупным скруглением, сегмент-контрол, значок «i». */
  :root{
    --accent:#0097ca; --accent2:#00bff0; --ink:#141a2e; --mut:#6a7385; --mut2:#9aa3b3;
    --border:rgba(20,32,64,.07); --radius:18px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 14px 34px -18px rgba(16,32,64,.20);
    --shadow-hi:0 2px 6px rgba(16,24,40,.06),0 26px 50px -22px rgba(16,32,64,.30);
    --green:#1d8a55; --red:#c0364a; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#f7f9fc 0%,#eef1f6 100%);min-height:100vh;display:flow-root;}
  html{background:#f7f9fc}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(1100px 520px at 50% -120px,#e9f3fb 0%,rgba(233,243,251,0) 70%);}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 70px;}

  /* шапка */
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .brand{display:inline-flex;flex-direction:column;text-decoration:none;color:var(--ink);}
  .brandrow{display:flex;align-items:center;gap:9px;}
  .brand img{height:19px;display:block;}
  .brand .wm{font-size:20px;font-weight:300;letter-spacing:.01em;line-height:1;
    background:linear-gradient(135deg,#2c6f96 0%,#3d95c7 55%,#5ac8fa 120%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:rgba(120,134,162,.10);border:1px solid rgba(20,32,64,.05);border-radius:13px;padding:4px;gap:3px;}
  .seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:transparent;color:#5a6478;border-radius:9px;
    padding:7px 13px;cursor:pointer;transition:all .2s var(--ease);}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.05),0 5px 12px -5px rgba(16,32,64,.22);}
  .dates{display:inline-flex;align-items:center;gap:4px;}
  .dates input{font:inherit;font-size:12.5px;color:#4c5568;border:1px solid rgba(20,32,64,.09);border-radius:10px;
    padding:6px 8px;background:rgba(255,255,255,.75);}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none;}
  .meta{color:var(--mut2);font-size:12px;margin:-10px 0 16px;}

  /* секции со сворачиванием */
  .sec{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden;}
  .sec-h{display:flex;align-items:center;gap:2px;padding:15px 18px;cursor:pointer;user-select:none;}
  .sec-h h2{font-size:14.5px;font-weight:700;letter-spacing:-.015em;margin:0;}
  .sec-h .sum{margin-left:auto;margin-right:12px;color:var(--mut);font-size:12.5px;font-weight:500;white-space:nowrap;}
  .sec-h .chev{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--mut2);
    transition:transform .25s var(--ease);flex:0 0 auto;transform:rotate(90deg);font-size:17px;}
  .sec-h .sp{margin-left:auto}
  .sec.closed .chev{transform:rotate(0deg)}
  .sec-b{padding:0 18px 18px;}
  .sec.closed .sec-b{display:none}

  /* плитки */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:760px){ .tiles{grid-template-columns:repeat(2,1fr)} }
  .tile{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:#fbfcfe;
    transition:transform .28s var(--ease),box-shadow .28s var(--ease),background .28s var(--ease);}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi);background:#fff;}
  .tile .k{font-size:11.5px;color:var(--mut);margin-bottom:6px;}
  .tile .v{font-size:21px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tile .v small{font-size:12px;font-weight:500;color:var(--mut2);margin-left:4px;letter-spacing:0;}
  .tile.acc{background:linear-gradient(135deg,#0b86b8 0%,#16aede 100%);border-color:transparent;color:#fff;
    box-shadow:0 12px 26px -14px rgba(0,151,202,.7);}
  .tile.acc .k,.tile.acc .v small{color:rgba(255,255,255,.82)}
  .tile.acc.neg{background:linear-gradient(135deg,#b8374c 0%,#dd5a6c 100%);box-shadow:0 12px 26px -14px rgba(192,54,74,.6);}

  /* график */
  .chart{position:relative;height:210px;}
  .chart svg{display:block;width:100%;height:100%;overflow:visible;}
  .chart .tip{position:absolute;pointer-events:none;background:#1c2333;color:#e7ecf5;font-size:11.5px;line-height:1.45;
    padding:7px 10px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-12px;
    box-shadow:0 10px 26px rgba(16,24,40,.3);opacity:0;transition:opacity .12s ease;z-index:2;}
  .chart .tip b{color:#fff;font-size:12.5px}
  .chart .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut2);font-size:13px;}

  /* воронка */
  .fun{display:flex;flex-direction:column;gap:9px;}
  .fr{display:grid;grid-template-columns:170px 1fr 64px 70px;align-items:center;gap:12px;font-size:13px;}
  .fr .l{color:#41506b;}
  .fr .bar{height:10px;border-radius:6px;background:rgba(20,32,64,.05);overflow:hidden;}
  .fr .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0b86b8,#18b6e6);
    transition:width .6s var(--ease);}
  .fr.last .bar i{background:linear-gradient(90deg,#1d8a55,#35b877);}
  .fr .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
  .fr .c{text-align:right;color:var(--mut2);font-size:12px;font-variant-numeric:tabular-nums;}
  .fun .note{color:var(--mut2);font-size:12px;margin-top:4px;}
  @media(max-width:640px){ .fr{grid-template-columns:110px 1fr 44px 52px;gap:8px;font-size:12.5px;} }

  /* таблицы */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  th{text-align:left;font-size:11px;font-weight:600;color:var(--mut2);padding:0 14px 9px 0;white-space:nowrap;}
  td{padding:9px 14px 9px 0;border-top:1px solid rgba(20,32,64,.055);white-space:nowrap;}
  th.r,td.r{text-align:right}
  th:last-child,td:last-child{padding-right:0}
  tbody tr:hover td{background:rgba(0,151,202,.03)}
  tfoot td{border-top:1.5px solid rgba(20,32,64,.12);font-weight:700;padding-top:11px;}
  .pos{color:var(--green);font-weight:600}
  .neg{color:var(--red);font-weight:600}
  .dim{color:var(--mut2)}
  .mono{font-family:SFMono-Regular,Consolas,monospace;font-size:12px;letter-spacing:.02em;}

  /* расходы */
  .tool{display:flex;justify-content:flex-end;margin:12px 0 0;}
  .btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid rgba(20,32,64,.09);background:rgba(255,255,255,.8);
    color:#4c5568;border-radius:10px;padding:7px 12px;cursor:pointer;transition:all .18s var(--ease);}
  .btn:hover{border-color:rgba(20,32,64,.18);color:var(--ink)}
  .btn.pri{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;color:#fff;
    box-shadow:0 8px 16px -8px rgba(0,151,202,.55);}
  .form{display:none;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;padding:14px;border-radius:14px;background:#f7f9fc;}
  .form.on{display:flex}
  .form label{display:block;font-size:11px;color:var(--mut);margin:0 0 4px}
  .form input{font:inherit;font-size:13px;border:1px solid rgba(20,32,64,.10);border-radius:10px;padding:7px 9px;background:#fff;}
  .x{border:0;background:none;color:var(--mut2);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px;}
  .x:hover{color:var(--red);background:rgba(192,54,74,.07)}

  /* значок «i» с пояснением — как в дашборде VSC */
  .inf{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
    border:1.3px solid currentColor;color:#aeb6c4;font:italic 700 10px/1 Georgia,"Times New Roman",serif;
    cursor:pointer;margin-left:8px;flex:0 0 auto;transition:color .15s ease;}
  .inf:hover{color:var(--accent)}
  .pop{display:none;position:fixed;z-index:9999;width:min(320px,80vw);background:#1c2333;color:#e7ecf5;
    font:400 12px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:11px 13px;
    border-radius:12px;box-shadow:0 14px 38px rgba(16,24,40,.38);}
  .pop.show{display:block}
  .pop b{color:#fff}

  .gate{max-width:340px;margin:16vh auto 0;background:#fff;border:1px solid var(--border);border-radius:22px;
    padding:34px 24px 26px;box-shadow:var(--shadow-hi);text-align:center;}
  .gate .brand{align-items:center;margin-bottom:88px}
  .gate input{width:100%;font:inherit;font-size:17px;text-align:center;letter-spacing:.3em;border:1px solid rgba(20,32,64,.10);
    border-radius:13px;padding:13px;margin-bottom:10px;}
  .gate input::placeholder{letter-spacing:0;color:#a3abb9;font-size:15px}
  .gate .btn{width:100%;padding:13px;font-size:14.5px}
  .bio-btn{width:100%;height:48px;margin:10px 0 0;border:1.5px solid #3589bd;background:#fff;color:#3589bd;border-radius:12px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;
    transition:background .2s var(--ease);}
  .bio-btn.show{display:flex}
  .bio-btn:hover:not(:disabled){background:#f0f7fc}
  .bio-btn:disabled{opacity:.6;cursor:progress}
  .bio-btn svg{width:18px;height:18px;flex-shrink:0}
  .bio-offer{display:none;margin-top:4px;padding:16px;background:#f0f7fc;border:1px solid #d3e7f4;border-radius:14px;text-align:left;}
  .bio-offer.show{display:block}
  .bio-offer h3{margin:0 0 6px;font-size:15px;color:#2f6e95}
  .bio-offer p{margin:0 0 12px;font-size:13px;color:#4a5260;line-height:1.4}
  .bio-offer-actions{display:flex;gap:10px}
  .bio-offer-actions button{flex:1;height:38px;border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .bio-skip{border:1.5px solid #d3d2da;background:#fff;color:#4a5260}
  .bio-enable{border:0;background:#3589bd;color:#fff}
  .bio-offer-actions button:disabled{opacity:.6;cursor:progress}
  .err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:8px;}
  @media(max-width:640px){
    .wrap{padding:16px 12px 60px}
    .tile .v{font-size:19px}
    .sec-h{padding:14px 15px}.sec-b{padding:0 15px 15px}
    .sec-h .sum{display:none}
    .sec-h .chev{margin-left:auto}
  }
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <div class="brand"><span class="brandrow"><img src="/voyo-logo.png" alt="VOYO"/><span class="wm">mobile</span></span></div>
  <div id="loginForm">
    <input id="code" type="password" inputmode="numeric" placeholder="Введите код" autocomplete="current-password"/>
    <button id="enter" class="btn pri" type="button">Войти</button>
    <button id="bioBtn" class="bio-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 11a3 3 0 0 0-3 3v1m6-1v3a3 3 0 0 1-6 0M6 11a6 6 0 0 1 12 0v3m-9 4a3 3 0 0 0 6 0M5 8a8 8 0 0 1 14 0M5 14v1a8 8 0 0 0 .35 2.34"/>
      </svg>
      Войти по Face ID / отпечатку
    </button>
    <div class="err" id="gateErr"></div>
  </div>
  <div id="bioOffer" class="bio-offer">
    <h3>Входить по Face ID?</h3>
    <p>Включите вход по Face ID / отпечатку — не нужно будет каждый раз вводить код на этом устройстве.</p>
    <div class="bio-offer-actions">
      <button type="button" id="bioSkip" class="bio-skip">Не сейчас</button>
      <button type="button" id="bioEnable" class="bio-enable">Включить</button>
    </div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="top">
    <a class="brand" href="/">
      <span class="brandrow"><img src="/voyo-logo.png" alt="VOYO"/><span class="wm">mobile</span></span>
    </a>
    <div class="ctrl">
      <div class="seg" id="seg">
        <button data-d="7">7 дней</button>
        <button data-d="30" class="on">30 дней</button>
        <button data-d="0">Всё время</button>
      </div>
      <span class="dates"><input id="from" type="date"/><input id="to" type="date"/></span>
      <label class="chk"><input id="withTest" type="checkbox"/> тестовые</label>
    </div>
  </div>
  <div class="meta" id="meta"></div>

  <section class="sec" data-id="sum">
    <div class="sec-h"><h2>Сводка</h2><span data-info="sum"></span><span class="sum" id="sumNote"></span><span class="chev">›</span></div>
    <div class="sec-b"><div class="tiles" id="tiles"></div></div>
  </section>

  <section class="sec" data-id="chart">
    <div class="sec-h"><h2>Выручка по дням</h2><span data-info="chart"></span><span class="sum" id="chartNote"></span><span class="chev">›</span></div>
    <div class="sec-b"><div class="chart" id="chart"><div class="tip" id="tip"></div></div></div>
  </section>

  <section class="sec" data-id="fsite">
    <div class="sec-h"><h2>Воронка сайта</h2><span data-info="fsite"></span><span class="sum" id="fsiteNote"></span><span class="chev">›</span></div>
    <div class="sec-b"><div class="fun" id="fsite"></div></div>
  </section>

  <section class="sec" data-id="fbot">
    <div class="sec-h"><h2>Воронка телеграм-бота</h2><span data-info="fbot"></span><span class="sum" id="fbotNote"></span><span class="chev">›</span></div>
    <div class="sec-b"><div class="fun" id="fbot"></div></div>
  </section>

  <section class="sec" data-id="ads">
    <div class="sec-h"><h2>Реклама и окупаемость</h2><span data-info="ads"></span><span class="sum" id="adsNote"></span><span class="chev">›</span></div>
    <div class="sec-b">
      <div class="scroll"><table id="tChan"></table></div>
      <div class="tool"><button class="btn" id="spendToggle" type="button">Расходы и комиссия</button></div>
      <div class="form" id="spendForm">
        <div><label>Канал</label><input id="sChannel" list="chanList" placeholder="yandex" style="width:120px"/>
          <datalist id="chanList"><option value="yandex">Яндекс Директ</option><option value="google">Google Ads</option>
          <option value="blogger">Блогеры</option><option value="vk">ВКонтакте</option></datalist></div>
        <div><label>Дата</label><input id="sDate" type="date"/></div>
        <div><label>Сумма, ₽</label><input id="sRub" type="number" min="1" step="1" style="width:110px"/></div>
        <div><label>Комментарий</label><input id="sNote" style="width:190px"/></div>
        <button class="btn pri" id="sAdd" type="button">Добавить</button>
        <div style="margin-left:auto"><label>Комиссия банка, %</label><input id="sAcq" type="number" step="0.1" min="0" max="20" style="width:80px"/></div>
        <div class="scroll" style="flex-basis:100%;margin-top:6px"><table id="tSpend"></table></div>
      </div>
    </div>
  </section>

  <section class="sec" data-id="days">
    <div class="sec-h"><h2>По дням</h2><span data-info="days"></span><span class="sp"></span><span class="chev">›</span></div>
    <div class="sec-b"><div class="scroll"><table id="tDays"></table></div></div>
  </section>

  <section class="sec" data-id="cust">
    <div class="sec-h"><h2>Клиенты</h2><span data-info="cust"></span><span class="sum" id="custNote"></span><span class="chev">›</span></div>
    <div class="sec-b"><div class="scroll"><table id="tCust"></table></div></div>
  </section>

  <section class="sec" data-id="promo">
    <div class="sec-h"><h2>Промокоды</h2><span data-info="promo"></span><span class="sum" id="promoNote"></span><span class="chev">›</span></div>
    <div class="sec-b"><div class="scroll"><table id="tPromo"></table></div></div>
  </section>
</div>

<script>
(function(){
  // Вход как в дашборд VSC, но свой: код или Face ID дают токен только на панель, на сутки.
  // Токен живёт только в памяти вкладки — при каждом открытии панель сама
  // спрашивает Face ID (так же устроен /admin: не восстанавливать сессию по
  // сохранённому токену, иначе ломается авто-вход по биометрии).
  var TOKEN = "";
  try{ localStorage.removeItem("voyo_esim_adm"); }catch(e){}   // раньше тут хранили сам код — больше не храним
  var DATA = null, DAYS = 30;
  var el = function(id){ return document.getElementById(id); };
  var RU = function(n){ return (Math.round(Number(n)||0)).toLocaleString("ru-RU"); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  var MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  function dShort(d){ var p = String(d).split("-"); return (+p[2]) + " " + MON[+p[1]-1]; }
  function fmtTs(ts){ return dShort(new Date(ts + 3*3600e3).toISOString().slice(0,10)); }
  function kRub(n){ return n >= 1000 ? (Math.round(n/100)/10).toString().replace(".", ",") + "k" : RU(n); }
  function pct(n){ return String(n).replace(".", ",") + "%"; }

  /* ── пояснения под «i» ── */
  var INFO = {
    sum: "<b>Итог</b> = выручка − себестоимость − комиссия банка − реклама.<br><b>Себестоимость</b> — закупка у поставщика по курсу ЦБ плюс 5% на конвертацию и 11% налога.<br>Свои проверочные покупки в цифры не входят, их можно включить галочкой «тестовые».",
    chart: "Выручка по дням оплаты, время московское. Наведите на график — покажет сумму и число пакетов за день.<br>Прошедшие сутки закрываются в полночь: себестоимость фиксируется по курсу того дня и дальше не меняется. Сегодняшний день — живые цифры.",
    ads: "Канал определяется по метке, с которой человек пришёл впервые (utm, yclid, gclid). Покупки в телеграм-боте — отдельный канал.<br><b>Маржа</b> — уже без себестоимости и комиссии банка. <b>Итог</b> — ещё и без расходов на рекламу. <b>ДРР</b> — доля рекламы в выручке.<br>Расход вносится со скриншотов кабинетов общей суммой за всё время.",
    fsite: "Уникальные посетители витрины на всех доменах (voyomobile.ru, voyotravel.ru/esim и другие), по шагам: зашёл → открыл карточку пакета → нажал «Оплатить» → оплатил.<br>Справа — доля от предыдущего шага. Первые три шага считает сама витрина, оплаты берутся из заказов. Счётчик работает с 18 сентября, раньше данных нет.",
    fbot: "Уникальные чаты бота по шагам: нажал «Старт» → выбрал страну → открыл пакет → получил ссылку на оплату → оплатил.<br>Справа — доля от предыдущего шага. Счётчик работает с 18 сентября; люди, которые начали диалог раньше, в первый шаг не попадают, пока снова не нажмут «Старт».",
    days: "Каждая строка — сутки по Москве. Маржа — выручка минус себестоимость, без комиссии банка и рекламы.",

  function head(cols, right){ return "<thead><tr>" + cols.map(function(c,i){ return "<th" + (right[i] ? ' class="r"' : "") + ">" + c + "</th>"; }).join("") + "</tr></thead>"; }

  /* ── график: тонкая плавная линия с заливкой, суммы — только при наведении ── */
  var PTS = [];
  function seriesDays(){
    var r = DATA._range, byDay = {};
    DATA.days.forEach(function(d){ byDay[d.day] = d; });
    var from = r.from || (DATA.days[0] && DATA.days[0].day), to = r.to || today();
    if (!from) return [];
    var out = [], d = from, guard = 0;
    while (d <= to && guard++ < 800) { out.push(byDay[d] || { day: d, revenue: 0, orders: 0 }); d = addDays(d, 1); }
    return out;
  }
  // монотонная кубическая кривая (Фрич — Карлсон): плавно и без провалов ниже нуля
  function monotone(p){
    var n = p.length; if (n < 2) return "";
    var dx = [], m = [], t = [], i;
    for (i = 0; i < n-1; i++){ dx[i] = p[i+1].x - p[i].x; m[i] = (p[i+1].y - p[i].y) / dx[i]; }
    t[0] = m[0]; t[n-1] = m[n-2];
    for (i = 1; i < n-1; i++) t[i] = (m[i-1]*m[i] <= 0) ? 0 : (m[i-1] + m[i]) / 2;
    for (i = 0; i < n-1; i++){
      if (m[i] === 0){ t[i] = 0; t[i+1] = 0; continue; }
      var a = t[i]/m[i], b = t[i+1]/m[i], s = a*a + b*b;
      if (s > 9){ var k = 3/Math.sqrt(s); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; }
    }
    var d = "M" + p[0].x.toFixed(1) + "," + p[0].y.toFixed(1);
    for (i = 0; i < n-1; i++){
      var h = dx[i] / 3;
      d += "C" + (p[i].x + h).toFixed(1) + "," + (p[i].y + t[i]*h).toFixed(1) + " " +
           (p[i+1].x - h).toFixed(1) + "," + (p[i+1].y - t[i+1]*h).toFixed(1) + " " +
           p[i+1].x.toFixed(1) + "," + p[i+1].y.toFixed(1);
    }
    return d;
  }
  function drawChart(){
    var box = el("chart"); if (!DATA || !box.offsetWidth) return;
    var days = seriesDays();
    box.querySelectorAll("svg,.empty").forEach(function(n){ n.remove(); });
    var total = days.reduce(function(a, d){ return a + d.revenue; }, 0);
    el("chartNote").textContent = days.length ? ("в среднем " + RU(total / days.length) + " ₽ в день") : "";
    if (!total || days.length < 2){
      var e = document.createElement("div"); e.className = "empty";
      e.textContent = total ? "нужно хотя бы два дня, чтобы построить линию" : "за этот период продаж не было";
      box.appendChild(e); return;
    }
    var W = box.offsetWidth, H = box.offsetHeight, L = 40, R = 12, T = 14, B = 26;
    var max = Math.max.apply(null, days.map(function(d){ return d.revenue; }));
    var step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
    if (top / max > 1.5) top = Math.ceil(max / (step/2)) * (step/2);
    var x = function(i){ return L + i * (W-L-R) / (days.length-1); };
    var y = function(v){ return T + (1 - v / top) * (H-T-B); };
    PTS = days.map(function(d, i){ return { x: x(i), y: y(d.revenue), d: d }; });
    var path = monotone(PTS), base = y(0).toFixed(1);
    var grid = "", lab = "";
    [0, .5, 1].forEach(function(f){
      var yy = y(top*f).toFixed(1);
      grid += '<line x1="' + L + '" x2="' + (W-R) + '" y1="' + yy + '" y2="' + yy + '" stroke="rgba(20,32,64,' + (f ? .055 : .11) + ')" stroke-width="1"/>';
      lab += '<text x="' + (L-8) + '" y="' + (+yy + 3.5) + '" text-anchor="end" font-size="10.5" fill="#9aa3b3">' + kRub(top*f) + '</text>';
    });
    // подписи дат: не больше семи и с запасом между ними, чтобы не налезали
    var n = days.length, every = Math.max(1, Math.ceil(n / 7));
    days.forEach(function(d, i){
      var last = i === n-1;
      if (!last && i % every) return;
      if (!last && n-1-i < every * 0.7) return;
      lab += '<text x="' + x(i).toFixed(1) + '" y="' + (H-7) + '" text-anchor="' + (i === 0 ? "start" : (last ? "end" : "middle")) +
        '" font-size="10.5" fill="#9aa3b3">' + dShort(d.day) + '</text>';
    });
    var dots = n <= 45 ? PTS.filter(function(p){ return p.d.revenue > 0; }).map(function(p){
      return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2.3" fill="#fff" stroke="#0097ca" stroke-width="1.4"/>';
    }).join("") : "";
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '">' +
      '<defs><linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00bff0" stop-opacity=".20"/>' +
      '<stop offset="1" stop-color="#00bff0" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b86b8"/><stop offset="1" stop-color="#18b6e6"/></linearGradient></defs>' +
      grid + lab +
      '<path d="' + path + " L" + PTS[n-1].x.toFixed(1) + "," + base + " L" + PTS[0].x.toFixed(1) + "," + base + 'Z" fill="url(#gFill)"/>' +
      '<path d="' + path + '" fill="none" stroke="url(#gLine)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots +
      '<line id="guide" y1="' + T + '" y2="' + base + '" stroke="rgba(0,151,202,.35)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>' +
      '<circle id="hot" r="4.2" fill="#0097ca" stroke="#fff" stroke-width="2" opacity="0"/>' +
      '<rect x="' + L + '" y="0" width="' + (W-L-R) + '" height="' + H + '" fill="transparent" id="hit"/></svg>';
    box.insertAdjacentHTML("afterbegin", svg);
    var hit = box.querySelector("#hit"), guide = box.querySelector("#guide"), hot = box.querySelector("#hot"), tip = el("tip");
    function show(evt){
      var rc = box.getBoundingClientRect(), mx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rc.left, best = PTS[0];
      PTS.forEach(function(p){ if (Math.abs(p.x - mx) < Math.abs(best.x - mx)) best = p; });
      guide.setAttribute("x1", best.x); guide.setAttribute("x2", best.x); guide.setAttribute("opacity", 1);
      hot.setAttribute("cx", best.x); hot.setAttribute("cy", best.y); hot.setAttribute("opacity", 1);
      tip.innerHTML = dShort(best.d.day) + "<br><b>" + RU(best.d.revenue) + " ₽</b> · " + best.d.orders + " шт";
      tip.style.left = Math.max(55, Math.min(W - 55, best.x)) + "px"; tip.style.top = best.y + "px"; tip.style.opacity = 1;
    }
    function hide(){ guide.setAttribute("opacity", 0); hot.setAttribute("opacity", 0); tip.style.opacity = 0; }
    hit.addEventListener("mousemove", show); hit.addEventListener("mouseleave", hide);
    hit.addEventListener("touchstart", show, { passive: true }); hit.addEventListener("touchmove", show, { passive: true });
  }

  function funnelHtml(steps){
    var top = steps[0].n || 0;
    return steps.map(function(st, i){
      var w = top ? Math.max(st.n ? 2 : 0, Math.round(st.n / top * 100)) : 0;
      var prev = i ? steps[i-1].n : 0;
      var conv = i ? (prev ? pct(Math.round(st.n / prev * 1000) / 10) : "—") : "";
      return '<div class="fr' + (i === steps.length-1 ? " last" : "") + '"><span class="l">' + st.label + '</span>' +
        '<span class="bar"><i style="width:' + w + '%"></i></span><span class="n">' + RU(st.n) + '</span>' +
        '<span class="c">' + conv + '</span></div>';
    }).join("");
  }

      }).join("") + "</tbody>";
  }

  /* ── вход: код или Face ID / Touch ID — та же механика, что у дашборда ── */
  var LOCAL_KEY = "voyo_esim_bio";         // на ЭТОМ устройстве ключ заведён
  var SKIP_KEY = "voyo_esim_bio_skip";     // «не сейчас» — больше не предлагать
  var BIO_FAST_FAIL_MS = 2000;             // быстрый отказ = ключа на устройстве уже нет
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
  function b64uToBytes(s){
    s = String(s).replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64u(buf){
    var b = new Uint8Array(buf), s = "";
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  async function platformOk(){
    try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
    catch(e){ return false; }
  }
  async function serverHasCreds(){
    try{ var r = await fetch("/esim/api/adm/webauthn/has-credentials", { cache: "no-store" }); return !!(await r.json()).hasCredentials; }
    catch(e){ return false; }
  }
  async function bioLogin(){
    try{
      var o = await fetch("/esim/api/adm/webauthn/auth-options", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      if (!o.ok) return false;
      var opts = await o.json();
      var publicKey = Object.assign({}, opts, { challenge: b64uToBytes(opts.challenge),
        allowCredentials: (opts.allowCredentials || []).map(function(c){ return Object.assign({}, c, { id: b64uToBytes(c.id) }); }) });
      var a = await navigator.credentials.get({ publicKey: publicKey });
      var v = await fetch("/esim/api/adm/webauthn/auth-verify", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ assertionResponse: { id: a.id, rawId: bytesToB64u(a.rawId), type: a.type,
          response: { clientDataJSON: bytesToB64u(a.response.clientDataJSON), authenticatorData: bytesToB64u(a.response.authenticatorData),
            signature: bytesToB64u(a.response.signature), userHandle: a.response.userHandle ? bytesToB64u(a.response.userHandle) : null },
          clientExtensionResults: a.getClientExtensionResults ? a.getClientExtensionResults() : {} } }) });
      var d = await v.json().catch(function(){ return {}; });
      if (v.ok && d.success && d.token){ TOKEN = d.token; lsSet(LOCAL_KEY, "1"); return true; }
      return false;
    }catch(e){ return false; }
  }
  async function bioRegister(){
    try{
      var o = await fetch("/esim/api/adm/webauthn/register-options", { method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN }, body: "{}" });
      if (!o.ok) return false;
      var opts = await o.json();
      var publicKey = Object.assign({}, opts, { challenge: b64uToBytes(opts.challenge),
        user: Object.assign({}, opts.user, { id: b64uToBytes(opts.user.id) }),
        excludeCredentials: (opts.excludeCredentials || []).map(function(c){ return Object.assign({}, c, { id: b64uToBytes(c.id) }); }) });
      var a = await navigator.credentials.create({ publicKey: publicKey });
      var v = await fetch("/esim/api/adm/webauthn/register-verify", { method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN },
        body: JSON.stringify({ attestationResponse: { id: a.id, rawId: bytesToB64u(a.rawId), type: a.type,
          response: { clientDataJSON: bytesToB64u(a.response.clientDataJSON), attestationObject: bytesToB64u(a.response.attestationObject) },
          clientExtensionResults: a.getClientExtensionResults ? a.getClientExtensionResults() : {} } }) });
      var d = await v.json().catch(function(){ return {}; });
      if (v.ok && d.success){ lsSet(LOCAL_KEY, "1"); return true; }
      return false;
    }catch(e){ return false; }
  }
  // Как на дашборде /vsc: кнопка Face ID видна, если устройство умеет и на
  // сервере уже заведён хоть один ключ. Первый раз — вход по коду, после него
  // на этой же карточке предложение «Входить по Face ID?».
  async function bioEligible(){
    var ok = await platformOk(); if (!ok) return false;
    return await serverHasCreds();
  }
  function enter(){
    el("bioOffer").classList.remove("show");
    el("gate").style.display = "none"; el("app").style.display = "block"; load();
  }
  function showForm(msg){
    el("loginForm").style.display = ""; el("bioOffer").classList.remove("show");
    el("gateErr").textContent = msg || "";
  }
  function gate(msg){
    TOKEN = "";
    el("app").style.display = "none"; el("gate").style.display = "block";
    showForm(msg);
    return bioEligible().then(function(ok){ el("bioBtn").classList.toggle("show", ok); if (!ok) el("code").focus(); return ok; });
  }
  el("bioBtn").addEventListener("click", async function(){
    var b = this, t0 = Date.now();
    el("gateErr").textContent = ""; b.disabled = true;
    var ok = await bioLogin();
    b.disabled = false;
    if (ok) return enter();
    if (Date.now() - t0 < BIO_FAST_FAIL_MS) {
      lsSet(LOCAL_KEY, null);
      el("gateErr").textContent = "На этом устройстве Face ID для панели не включён — войдите по коду, после входа предложим включить.";
    }
  });
  async function codeLogin(){
    var code = el("code").value.trim();
    if (!code) return;
    el("enter").disabled = true;
    var r = await fetch("/esim/api/adm/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code }) }).catch(function(){ return null; });
    el("enter").disabled = false;
    var d = r ? await r.json().catch(function(){ return {}; }) : {};
    if (!r || !r.ok || !d.token){ el("gateErr").textContent = d.message || "Не получилось войти."; return; }
    TOKEN = d.token; el("code").value = "";
    // Предлагаем Face ID прямо на карточке входа, как дашборд: если устройство
    // умеет, на нём ещё не включено и «Не сейчас» здесь не нажимали
    if (!lsGet(LOCAL_KEY) && !lsGet(SKIP_KEY) && await platformOk()){
      el("loginForm").style.display = "none"; el("bioOffer").classList.add("show");
      return;
    }
    enter();
  }
  el("enter").addEventListener("click", codeLogin);
  el("code").addEventListener("keydown", function(e){ if (e.key === "Enter") codeLogin(); });
  el("bioSkip").addEventListener("click", function(){ lsSet(SKIP_KEY, "1"); enter(); });
  el("bioEnable").addEventListener("click", async function(){
    el("bioEnable").disabled = el("bioSkip").disabled = true;
    var ok = await bioRegister();
    el("bioEnable").disabled = el("bioSkip").disabled = false;
    if (!ok) alert("Не удалось подключить Face ID на этом устройстве (возможно, запрос отменён). Можно продолжить с кодом — Face ID подключите при следующем входе.");
    enter();
  });

  // При открытии: если Face ID доступен — сразу спрашиваем его, код остаётся запасным путём
  (async function(){
    var ok = await gate();
    if (ok){
      await new Promise(function(r){ setTimeout(r, 150); });
      if (await bioLogin()) enter();
    }
  })();
})();
</script>
</body>
</html>
