<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VSC · Маркетинг-план</title>
<style>
  /* Стиль — в духе /vsc (Apple-скин): мягкий градиентный фон, белые карточки,
     крупные скругления, системный шрифт. Никаких сетевых шрифтов. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1d2433; background: #f4f6fa; min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(0, 190, 240, .14), transparent 60%),
      radial-gradient(900px 480px at 105% 12%, rgba(18, 58, 120, .10), transparent 55%),
      linear-gradient(180deg, #f7f9fc 0%, #eef2f8 100%);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  .brand { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 6px 0 18px; }
  .vsc-wm { display: flex; align-items: center; gap: 11px; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; }
  .vsc-wm i { width: 2px; height: 19px; border-radius: 2px; background: linear-gradient(180deg, #00bff0, #0088c2); opacity: .5; }
  .vsc-wm b { font-weight: 800; color: #0097ca; background: linear-gradient(135deg, #00c8f2 0%, #0097ca 52%, #123a78 130%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .brand .sub { font-size: 15px; font-weight: 700; color: #33415a; padding-top: 6px; }
  .card { background: rgba(255, 255, 255, .92); border: 1px solid rgba(20, 32, 64, .07); border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(20, 32, 64, .06); }
  /* Вход */
  #login { max-width: 420px; margin: 12vh auto 0; text-align: center; }
  #login input { width: 100%; padding: 13px 14px; font-size: 17px; border: 1px solid rgba(20, 32, 64, .14); border-radius: 12px; text-align: center; font-family: inherit; margin: 14px 0 12px; }
  #login button { width: 100%; padding: 13px; font-size: 16px; font-weight: 700; color: #fff; background: #0097ca; border: 0; border-radius: 12px; cursor: pointer; font-family: inherit; }
  #loginErr { color: #b0263a; font-size: 13.5px; min-height: 18px; margin-top: 8px; }
  /* Фильтры каналов */
  .chan-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  @media (max-width: 860px) { .chan-bar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; } .chan-pill { flex: 0 0 auto; } }
  .chan-pill { border: 1px solid #cfd8e3; background: #fff; color: #33415a; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; user-select: none; }
  .chan-pill.active { color: #fff; border-color: transparent; }
  /* Секции */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 2px 2px 12px; }
  .sec-h b { font-size: 16.5px; color: #1d2330; }
  .sec-h span { font-size: 12.5px; color: #8a90a0; }
  .task {
    border: 1px solid #edf0f5; border-left: 5px solid #c9cfda; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px; background: #fff; position: relative;
  }
  .task.done    { border-left-color: #3f9e63; background: #f2faf5; }
  .task.partial { border-left-color: #e3b53a; background: #fdf9ec; }
  .task.todo    { border-left-color: #d2685f; background: #fdf1f0; }
  .task .txt { font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; padding-right: 24px; }
  .task .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .task .tag { font-size: 11px; font-weight: 700; color: #fff; border-radius: 999px; padding: 3px 10px; }
  .st-btn { border: 1px solid rgba(20, 32, 64, .12); background: #fff; border-radius: 999px; font-size: 11.5px; font-weight: 700; padding: 3px 10px; cursor: pointer; font-family: inherit; }
  .st-btn.done { color: #2c7a43; } .st-btn.partial { color: #a8820a; } .st-btn.todo { color: #b0263a; }
  .task .acts { display: flex; gap: 4px; margin-left: auto; }
  .task .acts button { border: 0; background: transparent; color: #9aa0ab; font-size: 14px; cursor: pointer; padding: 3px 5px; border-radius: 7px; font-family: inherit; }
  .task .acts button:hover { background: #eef2f8; color: #33415a; }
  .add-btn { width: 100%; border: 1px dashed #b7c0cd; background: #f8fafc; color: #4a5568; border-radius: 12px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 2px; }
  .empty { color: #9aa0ab; font-size: 13.5px; padding: 10px 4px; }
  #saveStat { position: fixed; right: 14px; bottom: 12px; font-size: 12px; color: #8a90a0; background: rgba(255,255,255,.9); padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(20,32,64,.08); opacity: 0; transition: opacity .25s; }
  /* Модалка добавления/редактирования */
  #modal { position: fixed; inset: 0; background: rgba(20, 28, 46, .45); display: none; align-items: flex-start; justify-content: center; padding: 10vh 14px 0; z-index: 50; }
  #modal .m { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 520px; }
  #modal h3 { margin: 0 0 12px; font-size: 16px; }
  #modal textarea { width: 100%; min-height: 90px; font-family: inherit; font-size: 14.5px; padding: 10px 12px; border: 1px solid rgba(20, 32, 64, .14); border-radius: 10px; resize: vertical; }
  #modal .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  #modal select, #modal input[type=text] { font-family: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid rgba(20, 32, 64, .14); border-radius: 10px; }
  #modal .btns { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  #modal .btns button { font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid #cfd8e3; background: #fff; color: #33415a; }
  #modal .btns .pri { background: #0097ca; color: #fff; border-color: #0097ca; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="vsc-wm"><b>V</b><i></i><b>S</b><i></i><b>C</b></div>
    <div class="sub">Маркетинг-план</div>
  </div>

  <div id="login" class="card" style="display:none;">
    <div style="font-size:17px;font-weight:700;">Вход</div>
    <input id="email" type="email" placeholder="Рабочий e-mail" autocomplete="username" style="margin-bottom:0;">
    <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password" style="margin-top:8px;">
    <div style="font-size:12px;color:#9aa0ab;margin:2px 0 6px;">— или —</div>
    <input id="code" type="password" inputmode="numeric" placeholder="Код доступа (для админа)" autocomplete="off" style="margin-top:0;">
    <button id="loginBtn">Войти</button>
    <div id="loginErr"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="chan-bar" id="chanBar"></div>
    <div class="cols">
      <div class="card">
        <div class="sec-h"><b>В работе у Петрова</b><span id="cnt-petrov"></span></div>
        <div id="list-petrov"></div>
        <button class="add-btn" data-sec="petrov">+ Задача</button>
      </div>
      <div class="card">
        <div class="sec-h"><b>В работу</b><span id="cnt-backlog"></span></div>
        <div id="list-backlog"></div>
        <button class="add-btn" data-sec="backlog">+ Задача</button>
      </div>
      <div class="card">
        <div class="sec-h"><b>В работе у меня</b><span id="cnt-mine"></span></div>
        <div id="list-mine"></div>
        <button class="add-btn" data-sec="mine">+ Задача</button>
      </div>
      <div class="card">
        <div class="sec-h"><b>Идеи</b><span id="cnt-ideas"></span></div>
        <div id="list-ideas"></div>
        <button class="add-btn" data-sec="ideas">+ Задача</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="sec-h" id="doneHdr" style="cursor:pointer;user-select:none;margin-bottom:0;">
        <b><span id="doneArrow">▸</span> Сделано / архив</b><span id="cnt-done"></span>
      </div>
      <div id="doneBody" style="display:none;margin-top:12px;">
        <div id="list-done"></div>
        <button class="add-btn" data-sec="done">+ Запись в архив</button>
      </div>
    </div>
  </div>
</div>
<div id="saveStat">Сохранено</div>

<div id="modal">
  <div class="m">
    <h3 id="mTitle">Новая задача</h3>
    <textarea id="mText" placeholder="Текст задачи…"></textarea>
    <div class="row">
      <label style="font-size:13px;color:#5a626f;">Канал:</label>
      <select id="mChan"></select>
      <input id="mChanNew" type="text" placeholder="или новый канал" style="flex:1;min-width:140px;">
    </div>
    <div class="row">
      <label style="font-size:13px;color:#5a626f;">Секция:</label>
      <select id="mSec"></select>
    </div>
    <div class="btns">
      <button id="mCancel">Отмена</button>
      <button id="mSave" class="pri">Сохранить</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var TOKEN_KEY = "voyo_mkt_token";
  var token = null; try { token = localStorage.getItem(TOKEN_KEY); } catch (_) {}
  var state = { channels: [], tasks: [] };
  var chanFilter = null; // null = все
  var CH_COLORS = ["#0097ca", "#e8843b", "#8e44ad", "#2e7d52", "#c2185b", "#5c6bc0", "#00838f", "#8d6e63", "#7cb342", "#f4511e", "#3949ab", "#d81b60"];
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var chColor = function (name) { var i = state.channels.indexOf(name); return CH_COLORS[(i < 0 ? state.channels.length : i) % CH_COLORS.length]; };
  var $ = function (s) { return document.querySelector(s); };

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {});
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { showLogin(); throw new Error("auth"); }
      return r.json();
    });
  }
  function showLogin() { $("#login").style.display = ""; $("#app").style.display = "none"; }
  function showApp() { $("#login").style.display = "none"; $("#app").style.display = ""; }

  $("#loginBtn").addEventListener("click", doLogin);
  ["code", "pass", "email"].forEach(function (id) { $("#" + id).addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); }); });
  // Вход: e-mail+пароль руководителя (тот же аккаунт, что для /vsc — сейчас Петров)
  // ИЛИ админ-код. Токены разные, API принимает оба (requireMktPlan).
  function doLogin() {
    var email = $("#email").value.trim(), pass = $("#pass").value, code = $("#code").value.trim();
    var req = email
      ? fetch("/admin/api/manager-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email, password: pass }) })
      : fetch("/admin/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code }) });
    req.then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.token) { token = j.token; try { localStorage.setItem(TOKEN_KEY, token); } catch (_) {} load(); }
        else $("#loginErr").textContent = (j && j.message) || "Неверные данные входа";
      })
      .catch(function () { $("#loginErr").textContent = "Ошибка сети"; });
  }

  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      api("/admin/api/vsc/marketing-plan", { method: "POST", body: JSON.stringify({ data: state }) })
        .then(function (j) { var el = $("#saveStat"); el.textContent = j && j.success ? "Сохранено ✓" : "Ошибка сохранения"; el.style.opacity = "1"; setTimeout(function () { el.style.opacity = "0"; }, 1500); })
        .catch(function () {});
    }, 400);
  }

  function load() {
    api("/admin/api/vsc/marketing-plan").then(function (j) {
      state = (j && j.data) || { channels: [], tasks: [] };
      state.channels = state.channels || []; state.tasks = state.tasks || [];
      showApp(); render();
    }).catch(function () {});
  }

  // Секции — как в исходной таблице; done («Сделано») — сворачиваемый архив.
  var SECTIONS = ["petrov", "backlog", "mine", "ideas", "done"];
  var SEC_NAMES = { petrov: "В работе у Петрова", backlog: "В работу", mine: "В работе у меня", ideas: "Идеи", done: "Сделано / архив" };
  var doneOpen = false;
  $("#doneHdr").addEventListener("click", function () {
    doneOpen = !doneOpen;
    $("#doneArrow").textContent = doneOpen ? "▾" : "▸";
    $("#doneBody").style.display = doneOpen ? "" : "none";
    render();
  });
  // Статусы: null → todo → partial → done → null (клик по пилюле статуса)
  var ST = { done: "Сделано", partial: "Частично", todo: "Не сделано" };
  var nextSt = { "": "todo", todo: "partial", partial: "done", done: "" };

  function render() {
    // каналы: собрать из channels + фактических задач (на случай рассинхрона)
    state.tasks.forEach(function (t) { if (t.channel && state.channels.indexOf(t.channel) < 0) state.channels.push(t.channel); });
    var bar = $("#chanBar"); bar.innerHTML = "";
    var mk = function (label, val) {
      var b = document.createElement("button"); b.className = "chan-pill" + ((chanFilter === val) ? " active" : ""); b.textContent = label;
      if (chanFilter === val && val) b.style.background = chColor(val);
      if (chanFilter === val && !val) b.style.background = "#33415a";
      b.addEventListener("click", function () { chanFilter = (chanFilter === val) ? null : val; render(); });
      return b;
    };
    bar.appendChild(mk("Все каналы", null));
    state.channels.forEach(function (c) { bar.appendChild(mk(c, c)); });

    SECTIONS.forEach(function (sec) {
      var box = $("#list-" + sec); box.innerHTML = "";
      var list = state.tasks.filter(function (t) { return t.section === sec && (!chanFilter || t.channel === chanFilter); });
      var cnt = $("#cnt-" + sec); if (cnt) cnt.textContent = list.length ? (list.length + (chanFilter ? " по каналу" : "")) : "";
      if (sec === "done" && !doneOpen) return; // архив рендерим только развёрнутым (там ~1000 карточек)
      if (!list.length) { box.innerHTML = '<div class="empty">Пока пусто' + (chanFilter ? " по этому каналу" : "") + '.</div>'; return; }
      list.forEach(function (t) {
        var d = document.createElement("div"); d.className = "task " + (t.status || "");
        var stLabel = ST[t.status] || "Без статуса";
        d.innerHTML = '<div class="txt">' + esc(t.text) + '</div>'
          + '<div class="meta">'
          + (t.channel ? '<span class="tag" style="background:' + chColor(t.channel) + ';">' + esc(t.channel) + '</span>' : "")
          + '<button class="st-btn ' + (t.status || "") + '" title="Сменить статус">' + stLabel + '</button>'
          + '<div class="acts">'
          + (sec === "done"
            ? '<button class="a-back" title="Вернуть в «В работу»">↩</button>'
            : '<button class="a-arch" title="В «Сделано» (архив)">✓</button>')
          + '<button class="a-edit" title="Редактировать">✎</button>'
          + '<button class="a-del" title="Удалить">✕</button>'
          + '</div></div>';
        d.querySelector(".st-btn").addEventListener("click", function () { t.status = nextSt[t.status || ""] || ""; if (!t.status) delete t.status; t.updatedAt = Date.now(); save(); render(); });
        var arch = d.querySelector(".a-arch");
        if (arch) arch.addEventListener("click", function () { t.section = "done"; if (!t.status) t.status = "done"; t.updatedAt = Date.now(); save(); render(); });
        var back = d.querySelector(".a-back");
        if (back) back.addEventListener("click", function () { t.section = "backlog"; t.updatedAt = Date.now(); save(); render(); });
        d.querySelector(".a-edit").addEventListener("click", function () { openModal(t, sec); });
        d.querySelector(".a-del").addEventListener("click", function () {
          if (!confirm("Удалить задачу?\n\n«" + t.text.slice(0, 80) + "»")) return;
          state.tasks = state.tasks.filter(function (x) { return x !== t; }); save(); render();
        });
        box.appendChild(d);
      });
    });
  }

  // ── Модалка добавить/редактировать ──
  var mTask = null, mSec = "backlog";
  function openModal(task, sec) {
    mTask = task || null; mSec = sec;
    $("#mTitle").textContent = task ? "Редактировать задачу" : "Новая задача";
    $("#mText").value = task ? task.text : "";
    var sel = $("#mChan"); sel.innerHTML = '<option value="">— без канала —</option>';
    state.channels.forEach(function (c) { var o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); });
    sel.value = task && task.channel ? task.channel : (chanFilter || "");
    var ssel = $("#mSec"); ssel.innerHTML = "";
    SECTIONS.forEach(function (s) { var o = document.createElement("option"); o.value = s; o.textContent = SEC_NAMES[s]; ssel.appendChild(o); });
    ssel.value = task ? task.section : sec;
    $("#mChanNew").value = "";
    $("#modal").style.display = "flex";
    setTimeout(function () { $("#mText").focus(); }, 50);
  }
  document.querySelectorAll(".add-btn").forEach(function (b) { b.addEventListener("click", function () { openModal(null, b.getAttribute("data-sec")); }); });
  $("#mCancel").addEventListener("click", function () { $("#modal").style.display = "none"; });
  $("#modal").addEventListener("click", function (e) { if (e.target === $("#modal")) $("#modal").style.display = "none"; });
  $("#mSave").addEventListener("click", function () {
    var text = $("#mText").value.trim(); if (!text) { $("#mText").focus(); return; }
    var chan = $("#mChanNew").value.trim() || $("#mChan").value || "";
    var secSel = $("#mSec").value || mSec;
    if (chan && state.channels.indexOf(chan) < 0) state.channels.push(chan);
    if (mTask) { mTask.text = text; mTask.channel = chan || undefined; mTask.section = secSel; mTask.updatedAt = Date.now(); }
    else state.tasks.unshift({ id: "t" + Date.now() + Math.floor(Math.random() * 1000), section: secSel, channel: chan || undefined, text: text, createdAt: Date.now() });
    $("#modal").style.display = "none"; save(); render();
  });

  if (token) load(); else showLogin();
})();
</script>
</body>
</html>
