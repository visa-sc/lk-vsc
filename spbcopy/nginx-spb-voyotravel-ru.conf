# spb.voyotravel.ru — наша копия сайта spb.visa-sc.ru.
# Отдаёт отдельный процесс pm2 «spbcopy» (порт 3006), файлы в /var/www/spbcopy/site.
# Основной апп voyo и копия amoCRM этим конфигом не затронуты.
server {
    server_name spb.voyotravel.ru;
    client_max_body_size 20M;

    # Запрет индексации НЕ прописан здесь намеренно: им заведует сам сервис и
    # ставит его только на небоевых именах. Иначе при переезде домена легко
    # утащить noindex в бой вместе с конфигом.

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 120s;
    }

    listen 80;
    # TLS-часть (listen 443, пути к сертификатам) дописывает certbot прямо в
    # /etc/nginx/sites-available/spb-voyotravel — этот файл здесь как образец.
}
