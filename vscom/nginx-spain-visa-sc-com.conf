# spain.visa-sc.com — полная копия visa-sc.ru/spain_vnzh/ (Flexbe) на своём сервере.
# Статика лежит локально в /var/www/spain-visa-sc-com, а служебные ручки Flexbe
# (/mod/ — отправка заявок, статистика квиза; /api/ — ecommerce и промокоды)
# проксируются на visa-sc.ru с подменой Host, иначе формы копии никуда не уходят.
server {
    server_name spain.visa-sc.com;

    root /var/www/spain-visa-sc-com;
    index index.html;

    client_max_body_size 16m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Тема страницы уже скачана — её на origin не гоняем
    location ^~ /api/theme/ {
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /mod/ {
        proxy_pass https://visa-sc.ru;
        proxy_http_version 1.1;
        proxy_set_header Host visa-sc.ru;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass https://visa-sc.ru;
        proxy_http_version 1.1;
        proxy_set_header Host visa-sc.ru;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(webp|svg|png|jpg|jpeg|gif|ico|css|js|mjs|woff2?|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/spain.visa-sc.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/spain.visa-sc.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = spain.visa-sc.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name spain.visa-sc.com;
    return 404; # managed by Certbot


}