# visa-sc.com — англоязычная копия лендинга «ВНЖ Испании» (visa-sc.ru/spain_vnzh/).
# Статика лежит в /var/www/visa-sc-com и отдаётся напрямую nginx.
# В основное приложение (:3000) уходит ТОЛЬКО приём заявок /api/vscom-lead,
# причём с подменой Host на voyotravel.ru — чтобы host-зависимая логика ЛК
# ничего не заметила и клиентский кабинет был не при чём.
server {
    listen 80;
    server_name visa-sc.com www.visa-sc.com;

    root /var/www/visa-sc-com;
    index index.html;

    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /api/vscom-lead {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              voyotravel.ru;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
