<title>ВНЖ Испании: бесплатная консультация | VSC</title>
<meta name="description" content="Резиденция Испании позволяет жить в Испании и Европе дольше 90 дней. Бесплатная консультация: какая программа подходит именно вам, какие нужны документы, реальные сроки и стоимость.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://spain.visa-sc.com/ga">
<meta property="og:type" content="website">
<meta property="og:url" content="https://spain.visa-sc.com/ga">
<meta property="og:title" content="ВНЖ Испании: бесплатная консультация">
<meta property="og:description" content="Разберём вашу ситуацию: какая программа подходит, что нужно и сколько это стоит. Бесплатно и ни к чему не обязывает.">
<meta property="og:image" content="https://spain.visa-sc.com/img/og-cover.jpg">
<meta property="og:site_name" content="VSC Visa Services Center">
<meta property="og:locale" content="ru_RU">
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#10204a; --ink:#1b1f21; --muted:#6b7280;
  --accent:#ee7257; --accent-hover:#ff5a36;
  --gold:#ffbe3d; --blue:#0098ca; --blue-pale:#e5f5fa;
  --line:rgba(16,32,74,.12); --shadow:0 18px 44px rgba(16,32,74,.10);
  --radius:14px; --container:1150px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);
  font:400 16px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 24px}
.section{padding:66px 0}
.section--pale{background:var(--blue-pale)}
.section--navy{background:var(--navy);color:#fff}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em}
h2{font-size:clamp(25px,3.2vw,36px);line-height:1.16;margin-bottom:30px}
h3{font-size:18px;line-height:1.28}
p{margin:0 0 14px}

.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;
  font:500 16px/1 Roboto,Arial,sans-serif;padding:19px 28px;border-radius:10px;
  background:var(--accent);color:#fff;text-decoration:none;width:100%;text-align:center;
  transition:background .18s ease}
.btn:hover{background:var(--accent-hover)}
.btn--inline{width:auto}
.btn--sm{padding:13px 20px;font-size:15px}

.hdr{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.hdr__in{display:flex;align-items:center;gap:26px;height:68px}
.hdr__logo{width:44px;height:44px;flex:0 0 44px}
.hdr__nav{display:flex;gap:22px;font-size:15px;margin-right:auto}
.hdr__nav a{text-decoration:none;color:var(--ink);opacity:.85;white-space:nowrap}
.hdr__nav a:hover{opacity:1;color:var(--blue)}
.hdr__burger{display:none;margin-left:auto;background:none;border:0;padding:8px;cursor:pointer}
.hdr__burger span{display:block;width:22px;height:2px;background:var(--ink);margin:4px 0}
.hdr__tels{display:flex;flex-direction:column;gap:1px}
.hdr__tel{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;
  text-decoration:none;white-space:nowrap}
.hdr__tel img{width:17px;height:17px}
.lbl-s{display:none}

.hero{position:relative;color:#fff;overflow:hidden}
.hero__bg{position:absolute;inset:0;background:url('/img/hero-spain.webp') center/cover no-repeat}
.hero__veil{position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(9,18,40,.88) 0%,rgba(9,18,40,.70) 42%,rgba(9,18,40,.28) 72%,rgba(9,18,40,.38) 100%)}
.hero__in{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;
  align-items:center;padding-top:150px;padding-bottom:160px}
.hero h1{font-size:clamp(29px,3.6vw,40px);line-height:1.22;margin-bottom:16px}
.hero h1 .hl{background:rgba(0,152,202,.72);box-decoration-break:clone;
  -webkit-box-decoration-break:clone;padding:2px 6px;margin:0 -2px}
.hero__sub{color:rgba(255,255,255,.86);font-size:16px;max-width:660px;margin-bottom:28px;line-height:1.75}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:610px}
.fact{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:10px;
  padding:13px 15px;backdrop-filter:blur(3px)}
.fact span{display:block;font-size:13px;color:rgba(255,255,255,.65);margin-bottom:3px;white-space:nowrap}
.fact b{display:block;font-weight:500;font-size:16px}

/* Мессенджеры на первом экране: отдельная строка сетки во всю ширину, по центру.
   Люди, живущие за границей, чаще пишут в мессенджер, чем оставляют номер. */
.hero-msgr{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.hero-msgr .msgr{margin:0;padding:14px 26px;font-size:15.5px;
  box-shadow:0 8px 24px rgba(4,12,30,.28);transition:transform .15s ease,box-shadow .15s ease}
.hero-msgr .msgr:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(4,12,30,.34)}
.hero-msgr .msgr svg{width:18px;height:18px}

.card{background:#fff;color:var(--ink);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.card__title{font-size:23px;font-weight:500;line-height:1.26;margin-bottom:6px}
.card__title em{font-style:normal;background:var(--gold);padding:1px 5px;margin:0 -3px}
.card__sub{font-size:14.5px;margin-bottom:20px}
.field{margin-bottom:12px}
.field input{width:100%;height:56px;border:1px solid var(--line);border-radius:8px;background:#f6f8fb;
  padding:0 16px;font:400 16px/1 Roboto,Arial,sans-serif;color:var(--ink);outline:none;
  transition:border-color .15s ease,background .15s ease}
.field input:focus{border-color:var(--blue);background:#fff}
.field--err input{border-color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.consent{font-size:12.5px;margin:13px 0 0;line-height:1.45}
.form-note{display:none;margin-top:13px;font-size:14px;border-radius:8px;padding:11px 13px}
.form-note.is-err{display:block;background:#fdeae6;color:#b8351a}
.form-done{display:none;text-align:center;padding:14px 0}
.form-done h3{margin-bottom:10px}
.is-sent .form-body{display:none}
.is-sent .form-done{display:block}
.tick-round{width:54px;height:54px;margin:0 auto 15px;border-radius:50%;background:var(--blue-pale);
  display:flex;align-items:center;justify-content:center}
/* Карточка стоит внутри .hero, где у <p> белый цвет. Возвращаем читаемый. */
.card .card__sub,.card .consent,.card .form-done p{color:var(--muted)}
.card .consent a{color:var(--muted)}

.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(9,18,40,.6)}
.modal.is-on{display:flex}
.modal__box{background:#fff;border-radius:18px;padding:32px;width:100%;max-width:430px;position:relative;
  max-height:90vh;overflow:auto}
.modal__x{position:absolute;top:12px;right:15px;background:none;border:0;font-size:27px;line-height:1;
  color:var(--muted);cursor:pointer;padding:4px 8px}
.modal__box .card__sub,.modal__box .consent,.modal__box .form-done p{color:var(--muted)}
.modal__box .consent a{color:var(--muted)}

.grid{display:grid;gap:22px}
.grid--2{grid-template-columns:repeat(2,1fr)}
.grid--3{grid-template-columns:repeat(3,1fr)}

.benefit{display:flex;gap:15px;align-items:flex-start}
.benefit svg{flex:0 0 30px;width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.benefit b{display:block;font-weight:500;font-size:16.5px;margin-bottom:3px}
.benefit span{color:rgba(255,255,255,.72);font-size:15px}

.prog{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 24px}
.prog--top{border-color:var(--blue);box-shadow:0 14px 34px rgba(0,152,202,.16)}
.prog__badge{position:absolute;top:-13px;left:24px;background:var(--blue);color:#fff;border-radius:50px;
  padding:6px 15px;font-size:13px;font-weight:500}
.prog h3{margin-bottom:5px}
.prog__for{color:var(--muted);font-size:14.5px;margin-bottom:15px}
.prog ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.prog li{position:relative;padding-left:24px;font-size:15px}
.prog li:before{content:"";position:absolute;left:0;top:6px;width:13px;height:13px;border-radius:50%;
  background:var(--blue-pale);box-shadow:inset 0 0 0 2px var(--blue)}

.covers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.covers li{position:relative;padding-left:30px;font-size:16px}
.covers li:before{content:"";position:absolute;left:0;top:5px;width:17px;height:17px;border-radius:50%;
  background:var(--blue-pale);box-shadow:inset 0 0 0 2px var(--blue)}

.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{position:relative;padding-top:48px}
.step:before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:36px;height:36px;
  border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:500;font-size:15px}
.step b{display:block;font-weight:500;margin-bottom:3px}
.step span{color:var(--muted);font-size:15px}

.person{max-width:230px}
.person img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:12px;
  margin-bottom:12px;box-shadow:0 10px 26px rgba(16,32,74,.10)}
.person b{display:block;font-weight:500;font-size:15.5px}
.person span{color:var(--muted);font-size:14px}

.refuse{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:860px}
.refuse li{position:relative;padding-left:30px;font-size:16px;color:var(--muted)}
.refuse li b{color:var(--ink);font-weight:500}
.refuse li:before{content:"";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;
  background:#fdeae6;box-shadow:inset 0 0 0 2px var(--accent)}

.cta{background:linear-gradient(120deg,#10204a 0%,#1b3a72 100%);color:#fff;border-radius:18px;
  padding:40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:center}
.cta h3{font-size:25px;margin-bottom:8px}
.cta p{color:rgba(255,255,255,.75);margin:0;font-size:15.5px}

.faq{max-width:840px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-size:17px;font-weight:500;list-style:none;
  display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--blue);font-size:22px;line-height:1}
.faq details[open] summary:after{content:"–"}
.faq p{color:var(--muted);margin:10px 0 0}

.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:center}
.office{margin-bottom:22px;font-size:15.5px;line-height:1.6}
.office b{display:block;font-weight:500;font-size:16.5px;margin-bottom:3px}
.office a{text-decoration:none}
.office .mut{color:var(--muted)}
.msgr{display:inline-flex;align-items:center;gap:7px;margin:8px 10px 0 0;padding:11px 20px;
  border-radius:999px;color:#fff;font-weight:500;font-size:15px;line-height:1;text-decoration:none}
.msgr--wa{background:#25D366}
.msgr--tg{background:#229ED9}
.msgr svg{flex:none}

.ftr{background:#0d1830;color:rgba(255,255,255,.68);padding:44px 0 30px;font-size:14.5px}
.ftr a{color:#fff}
.ftr b{color:#fff;display:block;margin-bottom:8px;font-weight:500;font-size:16px}
.ftr__fine{border-top:1px solid rgba(255,255,255,.12);margin-top:26px;padding-top:20px;
  font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.5)}
.ftr__fine p{margin:0 0 9px}
.ftr__fine a{color:rgba(255,255,255,.7)}

@media (max-width:1000px){
  .hdr__nav{display:none}
  .hdr__burger{display:block}
  .hdr__nav.is-on{display:flex;position:absolute;top:68px;left:0;right:0;background:#fff;
    flex-direction:column;padding:18px 24px;gap:16px;border-bottom:1px solid var(--line);
    box-shadow:var(--shadow)}
  .hero__in{grid-template-columns:1fr;padding-top:100px;padding-bottom:110px}
  .grid--3,.steps{grid-template-columns:repeat(2,1fr)}
  .cta{grid-template-columns:1fr;padding:30px}
  .contact-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .section{padding:46px 0}
  .hero-msgr{gap:10px}
  .hero-msgr .msgr{flex:1 1 100%;max-width:330px;justify-content:center;padding:14px 18px}
  .facts{grid-template-columns:repeat(2,1fr)}
  .grid--2,.grid--3,.steps,.covers{grid-template-columns:1fr}
  .card{padding:23px}
  .hdr__in{gap:9px}
  .hdr__logo{width:38px;height:38px;flex:0 0 38px}
  .hdr__tels{margin-left:auto}
  .hdr__tel{font-size:12.5px;gap:4px}
  .hdr__tel img{width:14px;height:14px}
  .hdr .btn--sm{padding:9px 11px;font-size:12.5px}
  .hdr__burger{margin-left:0;padding:6px}
  .lbl-l{display:none}
  .lbl-s{display:inline}
  .person{max-width:100%}
}
</style>
</head>
