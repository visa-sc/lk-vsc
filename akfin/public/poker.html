<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Покер">
<meta name="theme-color" content="#0d1411">
<link rel="apple-touch-icon" href="/poker-icon.png">
<title>Покер</title>
<style>
/* Только карты и названия, сверху вниз от старшей комбинации к младшей.
   Тёмный фон: за столом полумрак, светлый экран слепит.
   Размер карт рассчитан на 440 pt ширины (iPhone 17 Pro Max) — пять карт
   в один ряд без переноса, на узких экранах ужимаются сами. */
:root{ --bg:#0d1411; --ink:#eef3f0; --acc:#d8b26a; --red:#d8323f; --black:#12181a; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(120% 55% at 50% 0%, #17241e 0%, #0d1411 60%)}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 14px 28px}

.combo{margin-bottom:22px}
.name{display:flex;align-items:baseline;gap:9px;margin:0 2px 9px}
.num{color:var(--acc);font-size:14px;font-weight:700;opacity:.65;min-width:16px}
.name h2{font-size:20px;font-weight:650;letter-spacing:-.02em}

.hand{display:flex;gap:2.2vw;}
.pc{flex:1 1 0;min-width:0;aspect-ratio:5/7;background:#fbfcfa;border-radius:8px;
  position:relative;color:var(--black);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pc.red{color:var(--red)}
.pc .ix{position:absolute;top:5%;left:8%;font-size:4.6vw;font-weight:800;line-height:1;letter-spacing:-.05em}
.pc .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11vw;line-height:1}
@media (min-width:520px){
  .hand{gap:11px}
  .pc .ix{font-size:23px}
  .pc .mid{font-size:56px}
}
</style>
</head>
<body>
<div class="wrap" id="list"></div>

<script>
/* Порядок сверху вниз = от старшей комбинации к младшей. */
const SUIT = { s: "♠", h: "♥", d: "♦", c: "♣" };
const COMBOS = [
  ["Флеш-рояль",   "As Ks Qs Js Ts"],
  ["Стрит-флеш",   "9h 8h 7h 6h 5h"],
  ["Каре",         "Qs Qh Qd Qc 4s"],
  ["Фулл-хаус",    "8s 8h 8d 3c 3s"],
  ["Флеш",         "Ad Jd 9d 6d 3d"],
  ["Стрит",        "9c 8d 7s 6h 5c"],
  ["Тройка",       "7s 7h 7d Kc 2s"],
  ["Две пары",     "Js Jh 4d 4c As"],
  ["Пара",         "Ts Th Ad 8c 5s"],
  ["Старшая карта","Ah Jd 9s 6c 3h"],
];

document.getElementById("list").innerHTML = COMBOS.map(function (c, i) {
  const cards = c[1].split(" ").map(function (code) {
    const r = code.slice(0, -1).replace("T", "10");
    const s = code.slice(-1);
    const red = (s === "h" || s === "d") ? " red" : "";
    return '<div class="pc' + red + '"><div class="ix">' + r + "</div>"
      + '<div class="mid">' + SUIT[s] + "</div></div>";
  }).join("");
  return '<div class="combo">'
    + '<div class="name"><div class="num">' + (i + 1) + "</div><h2>" + c[0] + "</h2></div>"
    + '<div class="hand">' + cards + "</div></div>";
}).join("");
</script>
</body>
</html>
